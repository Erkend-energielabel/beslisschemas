<title>Foto-opname · Erkend-Energielabel.nl</title>

<style>
:root{--g:#0f4a2c;--acc:#3cb54a;--dark:#10301f;--r:#c0392b;--bg:#f2f4f2;--tx:#123524;--mut:#6b7280;--line:#e3e7e3}
*{box-sizing:border-box}
body{margin:0;font:18px/1.4 Figtree,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:280px}
header{position:sticky;top:0;background:linear-gradient(135deg,#0f4a2c,#2e8f48);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;z-index:5;min-height:58px}
header h1{font-size:19px;margin:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.logo{background:#fff;border-radius:10px;padding:5px 8px;display:flex;align-items:center;flex:0 0 auto}
.logo img{height:28px;width:auto;display:block}
.infobalk{background:var(--dark);color:#e3efe6;font-size:12px;letter-spacing:2px;font-weight:700;text-transform:uppercase;padding:7px 14px;border-bottom:3px solid var(--acc)}
input[type=checkbox]{accent-color:var(--acc)}
main{padding:12px}
h2{margin:8px 0 4px;font-size:22px}
button,.knop{font:inherit;min-height:52px;padding:10px 16px;border:0;border-radius:12px;background:var(--g);color:#fff;font-weight:600;width:100%;margin:6px 0;display:block;text-align:center;cursor:pointer}
button.sec{background:#fff;color:var(--g);border:2px solid var(--g)}
button.klein{width:auto;min-height:44px;padding:8px 14px;margin:0;font-size:16px}
button.gevaar{background:var(--r)}
button.hdr{background:#fff;color:var(--g);width:auto;min-height:40px;margin:0;padding:6px 12px;font-size:16px}
.kaart{background:#fff;border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 1px 3px #0002;cursor:pointer}
.rij{display:flex;align-items:center;gap:10px;padding:12px;background:#fff;border-radius:12px;margin:8px 0}
.rij.klaar{opacity:.6}
.rij .info{flex:1;cursor:pointer;min-width:0}
.rij img{width:64px;height:64px;object-fit:cover;border-radius:8px;flex:0 0 auto}
.klein-tekst{color:var(--mut);font-size:15px}
button.sec:hover{background:#eef7f0}
button:not(.sec):not(.gevaar):hover{background:#1b6b3e}
label{display:block;font-weight:600;margin-top:10px}
input,select,textarea{font:inherit;width:100%;min-height:48px;padding:10px;border:2px solid #c5ccc8;border-radius:10px;margin:4px 0 8px;background:#fff}
input[type=checkbox]{width:30px;height:30px;min-height:0;margin:0;flex:0 0 auto}
.balk{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:3px solid var(--acc);padding:10px 12px calc(10px + env(safe-area-inset-bottom));font-size:16px;z-index:6}
.acties{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.acties>*{flex:1}
.acties .klein{flex:0 0 auto}
.melding{background:#fff3cd;border-radius:10px;padding:10px;margin:8px 0}
.foto-acties{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.foto-acties select{width:auto;flex:1;min-height:44px}
.opm{background:#f7f9f8;border-radius:10px;padding:8px 10px;margin:6px 0}
.voortgang{background:#dfe7e2;border-radius:99px;height:14px;overflow:hidden;margin:8px 0 4px}
.voortgang span{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .3s}
.voet{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;font-size:11px;line-height:1.35;color:var(--mut);border-top:1px solid var(--acc);margin-top:8px;padding-top:8px}
.voet b{color:var(--g)}
@media (max-width:600px){.voet{grid-template-columns:repeat(2,1fr)}}
</style>
</head>

  <h1 id="titel">Complexen</h1>
</header>
<div class="infobalk">Erkend-Energielabel.nl · Foto-opname</div>
<main id="app"></main>
<div class="balk" id="balk"></div>

<script>
/* ===== INSTELLINGEN ===== */
const CFG = {
  clientId: "f5581792-ec4a-435c-83c8-e3a5c921e0b7",   // Azure app-registratie (SPA)
  map: "Complexen",                        // map op OneDrive
  maxPx: 1600,                             // langste zijde na verkleinen
  kwaliteit: 0.8                           // JPEG-kwaliteit
};
const SCOPES = ["Files.ReadWrite", "Calendars.ReadWrite"];
const KEY = "fotoapp_complexen_v1";

/* MSAL wordt apart geladen. Lukt dat niet (geen internet, blokkade), dan werkt de app wél lokaal, alleen zonder OneDrive. */
const pca = (() => {
  if (!window.msal) return null;
  try {
    return new msal.PublicClientApplication({
      auth: { clientId: CFG.clientId, authority: "https://login.microsoftonline.com/59e480d9-96d4-4fda-8be4-6138b1c8577c", redirectUri: location.href.split("#")[0] },
      cache: { cacheLocation: "localStorage" }
    });
  } catch (e) { console.error(e); return null; }
})();
const accounts = () => (pca ? pca.getAllAccounts() : []);

/* ===== STATUS ===== */
let st = JSON.parse(localStorage.getItem(KEY) || '{"complexen":[]}');
let view = { s: "complexen" };
let FOTOS = [];
let URLS = [];
let bezig = false;
let backupTimer = null;

/* ===== HULP ===== */
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const findC = id => st.complexen.find(c => c.id === id);
const mapVan = c => c.map || (CFG.map + "/" + c.naam);
let MAPNAMEN = [];
const findA = (c, id) => c.adressen.find(a => a.id === id);
const nrLabel = a => String(a.nr) + (a.toev || "");
const sorteer = c => c.adressen.sort((a, b) => (a.klaar - b.klaar) || a.straat.localeCompare(b.straat) || a.nr - b.nr || (a.toev || "").localeCompare(b.toev || ""));
const fmt = iso => iso ? iso.replace("T", " ").slice(0, 16) : "";

function bewaarState() {
  localStorage.setItem(KEY, JSON.stringify(st));
  clearTimeout(backupTimer);
  backupTimer = setTimeout(() => stateNaarOneDrive(false), 3000);
}
let SEL = new Set();
function go(v) { view = v; SEL = new Set(); render(); }
function terug() {
  if (view.s === "adres") go({ s: "complex", c: view.c });
  else if (view.s === "complex") go({ s: "complexen" });
  else if (view.s === "nieuwAdres") go({ s: "complex", c: view.c });
  else if (view.s === "map") go({ s: "complex", c: view.c });
  else go({ s: "complexen" });
}

/* Bestandsnaam: eerste 2 letters van de straat + huisnummer + tijdstempel (nooit dubbel) */
function bestandsnaam(straat, nr) {
  const p = String(straat).normalize("NFD").replace(/[^a-zA-Z]/g, "").slice(0, 2).toUpperCase().padEnd(2, "X");
  const t = new Date();
  const ts = `${t.getFullYear()}${pad(t.getMonth()+1)}${pad(t.getDate())}-${pad(t.getHours())}${pad(t.getMinutes())}${pad(t.getSeconds())}-${String(t.getMilliseconds()).padStart(3,"0")}`;
  return `${p}${nr}_${ts}.jpg`;
}

/* ===== FOTO-OPSLAG (IndexedDB) ===== */
const DB = new Promise((res, rej) => {
  const r = indexedDB.open("fotoapp", 1);
  r.onupgradeneeded = () => r.result.createObjectStore("fotos", { keyPath: "id" });
  r.onsuccess = () => res(r.result);
  r.onerror = () => rej(r.error);
});
async function dbDo(mode, fn) {
  const db = await DB;
  return new Promise((res, rej) => {
    const tx = db.transaction("fotos", mode);
    const req = fn(tx.objectStore("fotos"));
    tx.oncomplete = () => res(req.result);
    tx.onerror = () => rej(tx.error);
    tx.onabort = () => rej(tx.error);
  });
}
const fotoPut = f => dbDo("readwrite", s => s.put(f));
const fotoDel = id => dbDo("readwrite", s => s.delete(id));
const fotosAll = () => dbDo("readonly", s => s.getAll());

/* Verkleinen: alleen de kopie wordt kleiner, het origineel blijft ongemoeid */
async function comprimeer(file) {
  const bmp = await createImageBitmap(file, { imageOrientation: "from-image" });
  const schaal = Math.min(1, CFG.maxPx / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas");
  c.width = Math.round(bmp.width * schaal);
  c.height = Math.round(bmp.height * schaal);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  if (bmp.close) bmp.close();
  return new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error("verkleinen mislukt")), "image/jpeg", CFG.kwaliteit));
}

/* ===== MICROSOFT / ONEDRIVE ===== */
async function token(ui) {
  if (!pca) throw new Error("Microsoft-inlog niet geladen");
  const acc = accounts()[0];
  if (!acc && !ui) throw new Error("niet ingelogd");
  try {
    return (await pca.acquireTokenSilent({ scopes: SCOPES, account: acc })).accessToken;
  } catch (e) {
    if (!ui) throw e;
    await pca.acquireTokenRedirect({ scopes: SCOPES });
  }
}
async function graph(path, opts = {}, ui = false) {
  const t = await token(ui);
  const r = await fetch("https://graph.microsoft.com/v1.0" + path, {
    ...opts,
    headers: { Authorization: "Bearer " + t, ...(opts.headers || {}) }
  });
  if (!r.ok) throw new Error(`Graph ${r.status}: ${await r.text()}`);
  return r.status === 204 ? null : r.json();
}
async function login() { if (!pca) return alert("Microsoft-inlog kon niet laden. Controleer je internetverbinding en probeer het opnieuw."); await pca.loginRedirect({ scopes: SCOPES }); }

/* Upload: pas wissen als OneDrive exact dezelfde grootte terugmeldt */
async function uploadFoto(f, c, ui) {
  const pathEnc = [...mapVan(c).split("/"), f.naam].map(encodeURIComponent).join("/");
  const item = await graph(`/me/drive/root:/${pathEnc}:/content?@microsoft.graph.conflictBehavior=rename`,
    { method: "PUT", body: f.blob, headers: { "Content-Type": "image/jpeg" } }, ui);
  if (item.size !== f.blob.size) throw new Error("grootte klopt niet na upload");
  f.uploaded = true;
  f.onedriveId = item.id;
  f.naam = item.name;
  await fotoPut(f);
}

async function stateNaarOneDrive(ui) {
  if (!navigator.onLine || (!ui && !accounts().length)) return;
  try {
    const blob = new Blob([JSON.stringify(st, null, 1)], { type: "application/json" });
    await graph(`/me/drive/root:/${encodeURIComponent(CFG.map)}/_backup_complexen.json:/content`,
      { method: "PUT", body: blob, headers: { "Content-Type": "application/json" } }, ui);
  } catch (e) { console.warn("backup mislukt", e); }
}

async function sync(ui) {
  if (bezig) return;
  if (!navigator.onLine) { if (ui) alert("Geen internetverbinding. Je foto's blijven veilig op dit toestel."); return; }
  if (!accounts().length && !ui) return;
  bezig = true;
  let fout = null;
  try {
    const wachtend = (await fotosAll()).filter(f => !f.uploaded);
    for (const f of wachtend) {
      const c = findC(f.complexId);
      if (c) await uploadFoto(f, c, ui);
    }
    await stateNaarOneDrive(ui);
  } catch (e) { fout = e; console.error(e); }
  bezig = false;
  await render();
  if (fout && ui) alert("Uploaden gestopt: " + fout.message + "\n\nJe foto's blijven op dit toestel staan. Probeer het later opnieuw.");
}

async function fotosToevoegen(ev, cId, aId) {
  const c = findC(cId), a = findA(c, aId);
  const files = [...ev.target.files];
  ev.target.value = "";
  for (const file of files) {
    try {
      const blob = await comprimeer(file);
      await fotoPut({ id: uid(), complexId: c.id, adresId: a.id, naam: bestandsnaam(a.straat, nrLabel(a)), blob, uploaded: false, createdAt: Date.now() });
    } catch (e) {
      alert(`Foto "${file.name}" kon niet worden verwerkt. Het origineel is niet veranderd.`);
    }
  }
  await render();
  sync(false);
}

async function fotoWis(id) {
  const f = FOTOS.find(x => x.id === id);

  let item = null;
  try { item = await graph(`/me/drive/items/${f.onedriveId}`, {}, true); } catch (e) { item = null; }

  if (!confirm(`Foto ${f.naam} uit de app verwijderen?\n\nDe kopie op OneDrive blijft staan.`)) return;

async function afspraakMaken(cId, aId) {
  const c = findC(cId), a = findA(c, aId);
  const d = $("afDatum") ? $("afDatum").value : "";
  const t = $("afTijd") ? $("afTijd").value : "";
  if (!d || !t) return alert("Kies eerst een datum en een tijd.");
  const start = `${d}T${t}:00`;
  const eind = new Date(new Date(start).getTime() + 3600000);
  const end = `${eind.getFullYear()}-${pad(eind.getMonth()+1)}-${pad(eind.getDate())}T${pad(eind.getHours())}:${pad(eind.getMinutes())}:00`;
  try {
    if (a.afspraak && a.afspraak.id) {
      await graph(`/me/events/${a.afspraak.id}`, { method: "DELETE" }, true).catch(() => {});
    }
    const ev = await graph("/me/events", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        subject: `Bezoek ${a.straat} ${nrLabel(a)} (${c.naam})`,
        start: { dateTime: start, timeZone: "W. Europe Standard Time" },
        end: { dateTime: end, timeZone: "W. Europe Standard Time" },

        body: { contentType: "text", content: "Bewoner thuis – gemaakt via foto-app" }
      })
    }, true);
    a.afspraak = { start, id: ev.id };
  } catch (e) { alert("Afspraak kon niet worden aangemaakt: " + e.message); return; }

  render();
}

function bewaarNieuwComplex() {

  st.complexen.push(c);
  bewaarState();
  go({ s: "nieuwAdres", c: c.id });
}
function bewaarNieuwAdres() {
  const c = findC(view.c);
  const straat = $("f1").value.trim(), van = parseInt($("f2").value, 10), tot = parseInt($("f3").value, 10);
  if (!straat || isNaN(van) || isNaN(tot) || tot < van) return alert("Controleer de straat en de huisnummers (tot moet gelijk of hoger zijn dan van).");
  if (tot - van > 200) return alert("Maximaal 200 huisnummers in één keer.");
  const keuze = $("f4").value;
  const toevs = ($("f5").value || "").split(",").map(t => t.trim().toUpperCase()).filter(Boolean);
  const nieuw = [];
  for (let n = van; n <= tot; n++) {
    if (keuze === "even" && n % 2 !== 0) continue;
    if (keuze === "oneven" && n % 2 === 0) continue;
    if (toevs.length) toevs.forEach(t => nieuw.push({ nr: n, toev: t }));
    else nieuw.push({ nr: n, toev: "" });
  }
  if (!nieuw.length) return alert("Geen huisnummers over met deze keuze.");
  for (const x of nieuw) {
    if (c.adressen.some(a => a.straat === straat && a.nr === x.nr && (a.toev || "") === x.toev)) continue;
    c.adressen.push({ id: uid(), straat, nr: x.nr, toev: x.toev, klaar: false, opmerkingen: [], afspraak: null });
  }
  bewaarState();
  go({ s: "complex", c: c.id });
}

/* ===== RENDER ===== */
async function render() {
  try {
    FOTOS = await Promise.race([
      fotosAll(),
      new Promise((_, rej) => setTimeout(() => rej(new Error("time-out")), 4000))
    ]);
    $("opslagmelding")?.remove();
  } catch (e) {
    console.error(e);
    FOTOS = [];
    if (!$("opslagmelding")) {
      const m = document.createElement("div");
      m.id = "opslagmelding";
      m.className = "melding";
      m.textContent = "Foto-opslag van dit toestel reageert niet. Gebruik Safari of Chrome gewoon (niet privé) en probeer opnieuw. Laat het me weten als dit blijft gebeuren.";
      document.body.insertBefore(m, document.body.firstChild);
    }
  }
  URLS.forEach(u => URL.revokeObjectURL(u)); URLS = [];

  let titel = "Complexen", inhoud = "", c = null, a = null;
  if (view.c) c = findC(view.c);
  if (view.a && c) a = findA(c, view.a);

  if (view.s === "complexen") inhoud = vComplexen();
  else if (view.s === "complex" && c) { titel = c.naam; inhoud = vComplex(c); }
  else if (view.s === "adres" && c && a) { titel = `${a.straat} ${nrLabel(a)}`; inhoud = vAdres(c, a); }
  else if (view.s === "nieuwComplex") { titel = "Nieuw complex"; inhoud = vNieuwComplex(); }
  else if (view.s === "map" && c) { titel = "Map kiezen"; inhoud = vMap(c); }
  else if (view.s === "nieuwAdres" && c) { titel = "Huisnummers"; inhoud = vNieuwAdres(c); }
  else { view = { s: "complexen" }; inhoud = vComplexen(); }

  const ingelogd = accounts().length > 0;
  if (!ingelogd) {
    $("titel").textContent = "Inloggen";
    $("terugknop").style.display = "none";
    $("app").innerHTML = `<div class="kaart" style="text-align:center;margin-top:24px">
      <h2>Log in om verder te gaan</h2>
      <p class="klein-tekst">Foto's worden opgeslagen in OneDrive van je eigen Microsoft-account. Zonder inloggen is de app niet beschikbaar.</p>
      ${pca ? `<button onclick="login()">Inloggen met Microsoft</button>`
            : `<div class="melding">Inloggen kan nu niet worden geladen. Controleer je internetverbinding en herlaad de pagina.</div>`}
    </div>`;
    $("balk").innerHTML = "";
    return;
  }

  $("titel").textContent = titel;
  $("terugknop").style.display = view.s === "complexen" ? "none" : "block";
  $("app").innerHTML = inhoud;
  if (view.s === "map") mapLaad();

  const wacht = FOTOS.filter(f => !f.uploaded).length;
  $("balk").innerHTML = `
    <div class="acties">
      <span class="klein-tekst" style="flex:1">${wacht} foto's wachten op OneDrive · ${FOTOS.length - wacht} op OneDrive</span>
      ${ingelogd
        ? `<button class="klein" onclick="sync(true)">Nu uploaden</button>`
        : `<button class="klein" onclick="login()">Inloggen</button>`}
    </div>
    ${navigator.onLine ? "" : `<div class="melding">Geen internet. Foto's blijven bewaard en worden later geüpload.</div>`}
    ${window.PERSISTENT ? "" : `<div class="klein-tekst">⚠ Opslag van dit toestel is niet vastgezet. Upload regelmatig naar OneDrive.</div>`}
    <div class="voet">
      <div><b>Erkend-Energielabel.nl</b><br>Aelbert Cuyplaan 45<br>3343 DA Hendrik Ido Ambacht</div>
      <div><b>T</b> 06 51 63 08 96<br><b>E</b> Info@Erkend-Energielabel.nl<br><b>W</b> www.Erkend-Energielabel.nl</div>
      <div><b>KvK</b> 42070461<br><b>btw</b> NL869571655B01</div>
      <div><b>Bank</b> KNAB<br>IBAN NL77 KNAB 0259 8692 79<br>BIC KNABNL2H</div>
    </div>`;
}

(async () => {
  try { if (pca) await pca.handleRedirectPromise(); } catch (e) { console.error(e); }
  window.PERSISTENT = !!(navigator.storage && navigator.storage.persist && await navigator.storage.persist().catch(() => false));
  await render();
  window.addEventListener("online", () => { render(); sync(false); });
  if (navigator.onLine) sync(false);
})();
</script>
