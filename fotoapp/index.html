<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Foto-opname · Erkend-Energielabel.nl</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.0/lib/msal-browser.min.js"></script>
<style>
:root{--g:#0f4a2c;--acc:#3cb54a;--dark:#10301f;--r:#c0392b;--bg:#f2f4f2;--tx:#123524;--mut:#6b7280;--line:#e3e7e3}
*{box-sizing:border-box}
body{margin:0;font:18px/1.4 Figtree,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:280px}
header{position:sticky;top:0;background:linear-gradient(135deg,#0f4a2c,#2e8f48);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;z-index:5;min-height:58px}
header h1{font-size:19px;margin:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.logo{background:#fff;border-radius:10px;padding:5px 8px;display:flex;align-items:center;flex:0 0 auto}
.logo img{height:28px;width:auto;display:block}
.infobalk{background:var(--dark);color:#e3efe6;font-size:12px;letter-spacing:2px;font-weight:700;text-transform:uppercase;padding:7px 14px;border-bottom:3px solid var(--acc)}
input[type=checkbox]{accent-color:var(--acc)}
main{padding:12px}
h2{margin:8px 0 4px;font-size:22px}
button,.knop{font:inherit;min-height:52px;padding:10px 16px;border:0;border-radius:12px;background:var(--g);color:#fff;font-weight:600;width:100%;margin:6px 0;display:block;text-align:center;cursor:pointer}
button.sec{background:#fff;color:var(--g);border:2px solid var(--g)}
button.klein{width:auto;min-height:44px;padding:8px 14px;margin:0;font-size:16px}
button.gevaar{background:var(--r)}
button.hdr{background:#fff;color:var(--g);width:auto;min-height:40px;margin:0;padding:6px 12px;font-size:16px}
.kaart{background:#fff;border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 1px 3px #0002;cursor:pointer}
.rij{display:flex;align-items:center;gap:10px;padding:12px;background:#fff;border-radius:12px;margin:8px 0}
.rij.klaar{opacity:.6}
.rij .info{flex:1;cursor:pointer;min-width:0}
.rij img{width:64px;height:64px;object-fit:cover;border-radius:8px;flex:0 0 auto}
.klein-tekst{color:var(--mut);font-size:15px}
button.sec:hover{background:#eef7f0}
button:not(.sec):not(.gevaar):hover{background:#1b6b3e}
label{display:block;font-weight:600;margin-top:10px}
input,select,textarea{font:inherit;width:100%;min-height:48px;padding:10px;border:2px solid #c5ccc8;border-radius:10px;margin:4px 0 8px;background:#fff}
input[type=checkbox]{width:30px;height:30px;min-height:0;margin:0;flex:0 0 auto}
.balk{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:3px solid var(--acc);padding:10px 12px calc(10px + env(safe-area-inset-bottom));font-size:16px;z-index:6}
.acties{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.acties>*{flex:1}
.acties .klein{flex:0 0 auto}
.melding{background:#fff3cd;border-radius:10px;padding:10px;margin:8px 0}
.foto-acties{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.foto-acties select{width:auto;flex:1;min-height:44px}
.opm{background:#f7f9f8;border-radius:10px;padding:8px 10px;margin:6px 0}
.tijdblok{min-width:76px;text-align:center;border-radius:12px;padding:6px 8px;background:#eef3ef;color:var(--g)}
.tijdblok .uur{font-size:26px;font-weight:700;line-height:1.1}
.tijdblok.groen{background:#16a34a;color:#fff}
.tijdblok.rood{background:#d97706;color:#fff}
.tijdblok.laat{background:#dc2626;color:#fff}
.rij .info{flex:1}
.pas{max-width:340px;border:2px solid var(--g);border-radius:14px;overflow:hidden;background:#fff;margin:10px 0}
.pas-kop{background:var(--g);color:#fff;display:flex;align-items:center;gap:8px;padding:8px 12px;font-weight:700}
.pas-kop img{height:28px}
.pas-body{display:flex;gap:12px;padding:12px;align-items:center}
.pas-foto{width:84px;height:104px;border:1px solid var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#f2f4f2;font-size:28px;flex:none}
.plat{position:relative;width:100%;touch-action:manipulation;cursor:crosshair}
.plat img{width:100%;display:block;border-radius:10px;border:1px solid var(--line)}
.stip{position:absolute;transform:translate(-50%,-50%);width:26px;height:26px;min-height:0;padding:0;border-radius:50%;background:#dc2626;color:#fff;border:2px solid #fff;font-size:12px;font-weight:700;line-height:22px;box-shadow:0 1px 4px #0006;margin:0}
.pas-groot{max-width:100%}
.pas-groot .pas-foto{width:140px;height:170px}
.pas{max-width:360px;border:none;border-radius:16px;box-shadow:0 8px 22px rgba(15,74,44,.18);background:#fff}
.pas-kop{background:linear-gradient(135deg,#0f4a2c,#2e8f48);padding:12px 14px;letter-spacing:.5px;text-transform:uppercase;font-size:12px}
.pas-kop img{height:30px;background:#fff;border-radius:6px;padding:3px}
.pas-body{padding:16px;gap:16px}
.pas-body strong{font-size:18px;color:#10301f}
.pas-foto{width:96px;height:120px;border-radius:12px;border:2px solid #e3e7e3;background:#f2f4f2}
.pas-voet{background:#f2f4f2;padding:8px 14px;border-top:1px solid #e3e7e3;font-size:11px}
.pas-blok{background:#fff;border:1px solid #e3e7e3;border-radius:14px;padding:12px;margin:14px 0}
.pas-blok input{margin-top:6px}
.no-print{}
@media print{.no-print{display:none}}
.pas-foto img{width:100%;height:100%;object-fit:cover}
.pas-voet{background:#f2f4f2;color:var(--mut);font-size:11px;padding:6px 12px;text-align:center}
.rij.vandaag{background:#e8f6ec;border-color:#bfe3c9}
.init{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;color:#fff;font-size:12px;font-weight:700;margin-left:6px;vertical-align:middle}
.pil{display:inline-block;padding:2px 10px;border-radius:999px;background:#eef3ef;color:var(--g);font-weight:600;font-size:13px}
#meldBanner{position:fixed;top:70px;left:10px;right:10px;background:var(--dark);color:#fff;border-radius:12px;padding:12px 14px;z-index:20;box-shadow:0 4px 14px #0005;display:none}
details.afspraak{margin:10px 0}
details.afspraak summary{cursor:pointer;list-style:none;padding:9px 12px;border-radius:10px;background:#fff;border:1px solid var(--line);color:var(--g);font-weight:600;font-size:16px}
details.afspraak summary::-webkit-details-marker{display:none}
details.afspraak[open] summary{border-bottom-left-radius:0;border-bottom-right-radius:0}
.afspraak-inhoud{background:#fff;border:1px solid var(--line);border-top:none;border-radius:0 0 10px 10px;padding:8px 12px 12px}
.voortgang{background:#dfe7e2;border-radius:99px;height:14px;overflow:hidden;margin:8px 0 4px}
.voortgang span{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .3s}
.voet{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;font-size:11px;line-height:1.35;color:var(--mut);border-top:1px solid var(--acc);margin-top:8px;padding-top:8px}
.voet b{color:var(--g)}
@media (max-width:600px){.voet{grid-template-columns:repeat(2,1fr)}}
</style>
</head>

/* Aftellen tot de afspraak: "over 45 min", "nu aan de beurt" of "geweest" */
function aftelTekst(startIso, gedaan) {
  if (gedaan) return "afgerond";
  const start = new Date(startIso).getTime(), nu = Date.now();
  if (nu >= start && nu <= start + 10 * 60000) return "nu aan de beurt";
  if (nu > start + 10 * 60000) return `te laat · ${Math.floor((nu - start) / 60000)} min`;
  const min = Math.ceil((start - nu) / 60000);
  const u = Math.floor(min / 60), m = min % 60;
  return `over ${u ? u + " u " : ""}${m} min`;
}
function updateAftel() {
  document.querySelectorAll(".aftel").forEach(el => { el.textContent = aftelTekst(el.dataset.start, el.dataset.gedaan === "1"); });
  document.querySelectorAll(".tijdblok").forEach(el => {
    const g = el.dataset.gedaan === "1";
    el.classList.toggle("laat", teLaat(el.dataset.start, g));
    el.classList.toggle("rood", !teLaat(el.dataset.start, g) && binnen30(el.dataset.start, g));
    el.classList.toggle("groen", groen30(el.dataset.start, g));
  });
  document.querySelectorAll(".nu-tijd").forEach(el => { el.textContent = `${datumVan(new Date())} ${hhmm(new Date())}`; });
}
function hhmm(d) { return `${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function datumVan(d) { return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
/* Binnen 30 minuten voor de start, of max 10 minuten na de start, en nog niet afgerond */
function binnen30(startIso, gedaan) {
  if (gedaan) return false;
  const min = (new Date(startIso).getTime() - Date.now()) / 60000;
  return min <= 30 && min >= -10;
}
/* Tussen 30 en 60 minuten voor de start, en nog niet afgerond */
function groen30(startIso, gedaan) {
  if (gedaan) return false;
  const min = (new Date(startIso).getTime() - Date.now()) / 60000;
  return min > 30 && min <= 60;
}
/* Meer dan 10 minuten na de start en nog niet afgerond */
function teLaat(startIso, gedaan) {
  if (gedaan) return false;
  return (Date.now() - new Date(startIso).getTime()) / 60000 > 10;
}
function controleerAfspraken() {
  const nu = Date.now();
  let veranderd = false;
  for (const c of st.complexen) for (const a of c.adressen) {
    if (!a.afspraak) continue;
    if (a.afspraak.gedaan) continue;
    const key = a.afspraak.id || a.afspraak.start;
    if (MELDINGEN_GEZIEN.has(key)) continue;
    const start = new Date(a.afspraak.start).getTime();
    if (nu >= start - 5 * 60000 && nu <= start + 60 * 60000) {
      MELDINGEN_GEZIEN.add(key);
      veranderd = true;
      toonMelding(`${a.straat} ${nrLabel(a)} · ${c.naam} om ${fmt(a.afspraak.start).slice(11)}`);
    }
  }
  if (veranderd) localStorage.setItem("fa_meld", JSON.stringify([...MELDINGEN_GEZIEN]));
}

/* Bestandsnaam: eerste 2 letters van de straat + huisnummer + tijd (bijv. ST12_1420.jpg). OneDrive hernoemt dubbelen zelf. */
function bestandsnaam(straat, nr) {
  const p = String(straat).normalize("NFD").replace(/[^a-zA-Z]/g, "").slice(0, 2).toUpperCase().padEnd(2, "X");
  const t = new Date();
  const ts = `${pad(t.getHours())}${pad(t.getMinutes())}`;
  return `${p}${nr}_${ts}.jpg`;
}

/* ===== FOTO-OPSLAG (IndexedDB) ===== */
const DB = new Promise((res, rej) => {
  const r = indexedDB.open("fotoapp", 2);
  r.onupgradeneeded = () => {
    const db = r.result;
    if (!db.objectStoreNames.contains("fotos")) db.createObjectStore("fotos", { keyPath: "id" });
    if (!db.objectStoreNames.contains("docs")) db.createObjectStore("docs", { keyPath: "id" });
  };
  r.onsuccess = () => res(r.result);
  r.onerror = () => rej(r.error);
});
async function dbDo(mode, fn, winkel = "fotos") {
  const db = await DB;
  return new Promise((res, rej) => {
    const tx = db.transaction(winkel, mode);
    const req = fn(tx.objectStore(winkel));
    tx.oncomplete = () => res(req.result);
    tx.onerror = () => rej(tx.error);
    tx.onabort = () => rej(tx.error);
  });
}
const fotoPut = f => dbDo("readwrite", s => s.put(f));
const fotoDel = id => dbDo("readwrite", s => s.delete(id));
const fotosAll = () => dbDo("readonly", s => s.getAll());
const docsAll = () => dbDo("readonly", s => s.getAll(), "docs");
const docPut = d => dbDo("readwrite", s => s.put(d), "docs");
const docDel = id => dbDo("readwrite", s => s.delete(id), "docs");

/* Verkleinen: alleen de kopie wordt kleiner, het origineel blijft ongemoeid */
async function comprimeer(file) {
  const bmp = await createImageBitmap(file, { imageOrientation: "from-image" });
  const schaal = Math.min(1, CFG.maxPx / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas");
  c.width = Math.round(bmp.width * schaal);
  c.height = Math.round(bmp.height * schaal);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  if (bmp.close) bmp.close();
  return new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error("verkleinen mislukt")), "image/jpeg", CFG.kwaliteit));
}

async function token(ui) {
  if (!pca) throw new Error("Microsoft-inlog niet geladen");
  const acc = accounts()[0];
  if (!acc && !ui) throw new Error("niet ingelogd");
  try {
    return (await pca.acquireTokenSilent({ scopes: SCOPES, account: acc })).accessToken;
  } catch (e) {
    if (!ui) throw e;
    await pca.acquireTokenRedirect({ scopes: SCOPES });
  }
}
async function graph(path, opts = {}, ui = false) {
  const t = await token(ui);
  const r = await fetch("https://graph.microsoft.com/v1.0" + path, {
    ...opts,
    headers: { Authorization: "Bearer " + t, ...(opts.headers || {}) }
  });
  if (!r.ok) throw new Error(`Graph ${r.status}: ${await r.text()}`);
  return r.status === 204 ? null : r.json();
}
async function login() { if (!pca) return alert("Microsoft-inlog kon niet laden. Controleer je internetverbinding en probeer het opnieuw."); await pca.loginRedirect({ scopes: SCOPES }); }

/* Upload: pas wissen als OneDrive exact dezelfde grootte terugmeldt */
/* Maakt ontbrekende mappen aan, van boven naar beneden */
async function zorgMap(pad, ui) {
  if (ZEKER.has(pad)) return;
  const delen = pad.split("/");
  for (let i = 1; i <= delen.length; i++) {
    const p = delen.slice(0, i).join("/");
    if (ZEKER.has(p)) continue;
    try {
      await graph(`/me/drive/root:/${p.split("/").map(encodeURIComponent).join("/")}`, {}, ui);
    } catch (e) {
      const ouder = delen.slice(0, i - 1).join("/");
      const url = ouder ? `/me/drive/root:/${ouder.split("/").map(encodeURIComponent).join("/")}:/children` : `/me/drive/root/children`;
      await graph(url, { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: delen[i - 1], folder: {}, "@microsoft.graph.conflictBehavior": "fail" }) }, ui);
    }
    ZEKER.add(p);
  }
  ZEKER.add(pad);
}

async function uploadFoto(f, c, ui) {
  const a = findA(c, f.adresId);
  const pad = a ? adresMap(c, a) : mapVan(c);
  await zorgMap(pad, ui);
  const pathEnc = [...pad.split("/"), f.naam].map(encodeURIComponent).join("/");
  const item = await graph(`/me/drive/root:/${pathEnc}:/content?@microsoft.graph.conflictBehavior=rename`,
    { method: "PUT", body: f.blob, headers: { "Content-Type": "image/jpeg" } }, ui);
  if (item.size !== f.blob.size) throw new Error("grootte klopt niet na upload");
  f.uploaded = true;
  f.onedriveId = item.id;
  f.naam = item.name;
  await fotoPut(f);
}

/* ===== GEDEELDE STATUS OP ONEDRIVE (Complexen/_gedeeld.json) =====
   Elk toestel zet wijzigingen om in een tijdstempel (_t). Bij sync wordt het bestand van OneDrive
   samengevoegd met wat dit toestel heeft: de nieuwste versie wint, opmerkingen worden samengevoegd,
   verwijderde complexen blijven weg (verwijderd). Met If-Match wordt niets overschreven dat ondertussen is veranderd. */
const GEDEELD = CFG.map + "/_gedeeld.json";
let SNAP = JSON.parse(localStorage.getItem("fa_snap") || "{}");   // laatste bekende staat per item
const stabiel = o => JSON.stringify(o, (k, v) => (v && typeof v === "object" && !Array.isArray(v))
  ? Object.keys(v).sort().reduce((r, kk) => (r[kk] = v[kk], r), {}) : v);
const cSleutel = c => stabiel({ naam: c.naam, map: c.map, gearchiveerd: !!c.gearchiveerd });
const aSleutel = a => { const { _t, opmerkingWacht, ...r } = a; return stabiel(r); };
/* Zet een tijdstempel op alles wat sinds de laatste sync is veranderd */
function stempel() {
  const nu = new Date().toISOString();
  for (const c of st.complexen) {
    if (SNAP["c:" + c.id] !== cSleutel(c)) c._t = nu;
    for (const a of c.adressen) if (SNAP["a:" + a.id] !== aSleutel(a)) a._t = nu;
  }
}
function snapMaken() {
  SNAP = {};
  for (const c of st.complexen) {
    SNAP["c:" + c.id] = cSleutel(c);
    for (const a of c.adressen) SNAP["a:" + a.id] = aSleutel(a);
  }
  localStorage.setItem("fa_snap", JSON.stringify(SNAP));
}
function nieuwste(lijst) { return lijst.reduce((a, b) => ((b._t || "") > (a._t || "") ? b : a)); }
function samenAdres(lijst) {
  const out = { ...nieuwste(lijst) };
  const opm = new Map();
  for (const a of lijst) for (const o of a.opmerkingen || []) opm.set(o.t + "|" + o.tekst, o);
  out.opmerkingen = [...opm.values()].sort((x, y) => x.t.localeCompare(y.t));
  out.opmerkingWacht = lijst.some(a => a.opmerkingWacht);
  return out;
}
function samenComplex(lijst) {
  const out = { ...nieuwste(lijst), adressen: [] };
  const av = {};
  for (const c of lijst) for (const a of c.adressen || []) (av[a.id] ||= []).push(a);
  out.adressen = Object.values(av).map(samenAdres);
  return out;
}
function samenvoegen(loc, rem) {
  const graf = new Map();   // verwijderde complexen: id -> tijdstip
  for (const t of [...(loc.verwijderd || []), ...(rem.verwijderd || [])]) {
    if (!graf.has(t.id) || t.t > graf.get(t.id).t) graf.set(t.id, t);
  }
  const vers = {};
  for (const c of [...(loc.complexen || []), ...(rem.complexen || [])]) (vers[c.id] ||= []).push(c);
  const complexen = [];
  for (const id in vers) {
    const g = graf.get(id);
    const over = g ? vers[id].filter(c => (c._t || "") > g.t) : vers[id];
    if (over.length) complexen.push(samenComplex(over));
  }
  return { complexen, verwijderd: [...graf.values()] };
}
async function gedeeldSyncEcht(ui) {
  if (!navigator.onLine || !accounts().length) return false;
  const enc = p => p.split("/").map(encodeURIComponent).join("/");
  let veranderd = false;
  for (let poging = 0; poging < 3; poging++) {
    let etag = null, rem = { complexen: [], verwijderd: [] };
    try {
      etag = (await graph(`/me/drive/root:/${enc(GEDEELD)}`, {}, ui)).eTag;
      rem = (await graph(`/me/drive/root:/${enc(GEDEELD)}:/content`, {}, ui)) || rem;
    } catch (e) {
      if (!String(e.message).startsWith("Graph 404")) throw e;   // bestand bestaat nog niet
    }
    stempel();
    const voor = stabiel(st);
    st = samenvoegen(st, rem);
    veranderd = veranderd || stabiel(st) !== voor;
    localStorage.setItem(KEY, JSON.stringify(st));
    snapMaken();
    try {
      await zorgMap(CFG.map, ui);
      const blob = new Blob([JSON.stringify(st, null, 1)], { type: "application/json" });
      await graph(`/me/drive/root:/${enc(GEDEELD)}:/content`, { method: "PUT", body: blob,
        headers: { "Content-Type": "application/json", ...(etag ? { "If-Match": etag } : {}) } }, ui);
      return veranderd;
    } catch (e) {
      if (String(e.message).startsWith("Graph 412")) continue;   // iemand anders schreef net: opnieuw samenvoegen
      throw e;
    }
  }
  throw new Error("het gedeelde bestand wijzigde te vaak tegelijk");
}
/* Syncs na elkaar, nooit tegelijk */
let GEDEELD_Q = Promise.resolve();
function gedeeldSync(ui) {
  const p = GEDEELD_Q.then(() => gedeeldSyncEcht(ui));
  GEDEELD_Q = p.catch(() => {});
  return p;
}

let SYNC_FOUT = null;   // laatste uploadfout, zichtbaar in de balk onderaan
/* Zet alle opmerkingen van een adres in een tekstbestand in de adresmap op OneDrive */
async function uploadOpmerkingen(c, a, ui) {
  const pad = adresMap(c, a);
  await zorgMap(pad, ui);
  const tekst = (a.opmerkingen || []).map(o => `${fmtLokaal(o.t)}  ${o.tekst}`).join("\r\n");
  const blob = new Blob(["\uFEFF" + tekst], { type: "text/plain;charset=utf-8" });
  await graph(`/me/drive/root:/${pad.split("/").map(encodeURIComponent).join("/")}/opmerkingen.txt:/content`,
    { method: "PUT", body: blob, headers: { "Content-Type": "text/plain" } }, ui);
}

async function sync(ui) {
  if (bezig) return;
  if (!navigator.onLine) { if (ui) alert("Geen internetverbinding. Je foto's blijven veilig op dit toestel."); return; }
  if (!accounts().length && !ui) return;
  bezig = true;
  let fout = null;
  try {
    const wachtend = (await fotosAll()).filter(f => !f.uploaded);
    for (const f of wachtend) {
      const c = findC(f.complexId);
      if (c) await uploadFoto(f, c, ui);
    }
    for (const d of (await docsAll()).filter(x => !x.uploaded)) {
      const c = findC(d.complexId);
      if (!c) continue;
      const pad = mapVan(c) + "/Documenten";
      await zorgMap(pad, ui);
      const item = await graph(`/me/drive/root:/${[...pad.split("/"), d.naam].map(encodeURIComponent).join("/")}:/content?@microsoft.graph.conflictBehavior=rename`,
        { method: "PUT", body: d.blob, headers: { "Content-Type": d.type } }, ui);
      if (item.size !== d.blob.size) throw new Error("grootte klopt niet na upload");
      d.uploaded = true;
      d.onedriveId = item.id;
      d.naam = item.name;
      await docPut(d);
    }
    for (const c of st.complexen) for (const a of c.adressen) {
      if (!a.opmerkingWacht) continue;
      await uploadOpmerkingen(c, a, ui);
      a.opmerkingWacht = false;
      bewaarState();
    }
    await gedeeldSync(ui);
  } catch (e) { fout = e; console.error(e); }
  bezig = false;
  SYNC_FOUT = fout ? fout.message : null;
  await render();
  if (fout && ui) alert("Uploaden gestopt: " + fout.message + "\n\nJe foto's blijven op dit toestel staan. Probeer het later opnieuw.");
}

/* Overzicht per complex als CSV (opent in Excel, klaar om af te drukken) */
function fmtLokaal(iso) { const d = new Date(iso); return `${datumVan(d)} ${hhmm(d)}`; }
function exportComplex(cId) {
  const c = findC(cId);
  const q = s => `"${String(s ?? "").replace(/"/g, '""')}"`;
  const rijen = [["Straat", "Huisnummer", "Woning klaar", "Klaar op", "Afspraak", "Foto's", "Opmerkingen"]];
  for (const a of sortedAdressen(c)) {
    const aantal = FOTOS.filter(f => f.adresId === a.id).length;
    const afspraak = a.afspraak ? fmt(a.afspraak.start) + (a.afspraak.gedaan ? " (afgerond)" : "") : "";
    const opm = (a.opmerkingen || []).map(o => `${fmtLokaal(o.t)}: ${o.tekst}`).join(" | ");
    rijen.push([a.straat, nrLabel(a), a.klaar ? "ja" : "nee", a.klaarOp ? fmtLokaal(a.klaarOp) : "", afspraak, aantal, opm]);
  }
  const naam = `${c.naam} overzicht`;
  if (window.XLSX) {
    const ws = XLSX.utils.aoa_to_sheet(rijen);
    ws["!cols"] = [{ wch: 24 }, { wch: 11 }, { wch: 13 }, { wch: 18 }, { wch: 18 }, { wch: 9 }, { wch: 60 }];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Overzicht");
    const data = XLSX.write(wb, { bookType: "xlsx", type: "array" });
    slaOp(new Blob([data], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }), `${naam}.xlsx`);
  } else {
    const csv = rijen.map(r => r.map(q).join(";")).join("\r\n");
    slaOp(new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8" }), `${naam}.csv`);
    alert("De Excel-bibliotheek kon niet laden. Je krijgt een CSV-bestand; dat opent ook in Excel.");
  }
}
function slaOp(blob, naam) {
  const url = URL.createObjectURL(blob);
  const el = document.createElement("a");
  el.href = url;
  el.download = naam;
  document.body.appendChild(el);
  el.click();
  el.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* Maakt de tekst netjes: spaties weg, dubbele spaties eruit, hoofdletter aan het begin van elke zin, punt aan het eind */
function opmerkingNetjes() {
  const inp = $("nieuweOpm");
  let t = inp.value.replace(/\s+/g, " ").trim();
  if (!t) return;
  t = t.replace(/\s+([.,!?;:])/g, "$1").replace(/([.!?])\s*(?=\S)/g, "$1 ");
  t = t.replace(/(^|[.!?]\s+)([a-zà-ÿ])/g, (m, a, b) => a + b.toUpperCase());
  if (!/[.!?]$/.test(t)) t += ".";
  inp.value = t;
  inp.focus();
}
function opmerkingToevoegen(cId, aId) {
  const inp = $("nieuweOpm");
  const tekst = inp.value.trim();
  if (!tekst) return;
  const a = findA(findC(cId), aId);

  render();
  sync(false);
}

async function afspraakMaken(cId, aId) {
  const c = findC(cId), a = findA(c, aId);
  const d = $("afDatum") ? $("afDatum").value : "";
  const t = $("afTijd") ? $("afTijd").value : "";
  if (!d || !t) return alert("Kies eerst een datum en een tijd.");
  const start = `${d}T${t}:00`;
  const dur = parseInt($("afDuur") ? $("afDuur").value : "10", 10) || 10;
  const eind = new Date(new Date(start).getTime() + dur * 60000);
  const end = `${eind.getFullYear()}-${pad(eind.getMonth()+1)}-${pad(eind.getDate())}T${pad(eind.getHours())}:${pad(eind.getMinutes())}:00`;
  const nS = new Date(start).getTime(), nE = eind.getTime();
  for (const cc of st.complexen) for (const x of cc.adressen) {
    if (x.id === aId || !x.afspraak) continue;
    const s = new Date(x.afspraak.start).getTime(), e = x.afspraak.eindMs || s + 15 * 60000;
    if (nS < e && s < nE) return alert(`Dit overlapt met ${x.straat} ${nrLabel(x)} om ${fmt(x.afspraak.start).slice(11)}. Kies een ander tijdstip.`);
  }
  try {
    if (a.afspraak && a.afspraak.id) {
      await graph(`/me/events/${a.afspraak.id}`, { method: "DELETE" }, true).catch(() => {});
    }
    const ev = await graph("/me/events", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        subject: `Bezoek ${a.straat} ${nrLabel(a)} (${c.naam})`,
        start: { dateTime: start, timeZone: "W. Europe Standard Time" },
        end: { dateTime: end, timeZone: "W. Europe Standard Time" },
        location: { displayName: `${a.straat} ${nrLabel(a)}` },
        body: { contentType: "text", content: "Bewoner thuis – gemaakt via foto-app" }
      })
    }, true);
    a.afspraak = { start, eindMs: eind.getTime(), id: ev.id, door: eigenaar() };
  } catch (e) { alert("Afspraak kon niet worden aangemaakt: " + e.message); return; }
  bewaarState();
  render();
}

function bewaarNieuwAdres() {
  const c = findC(view.c);
  const straat = $("f1").value.trim(), van = parseInt($("f2").value, 10), tot = parseInt($("f3").value, 10);
  if (!straat || isNaN(van) || isNaN(tot) || tot < van) return alert("Controleer de straat en de huisnummers (tot moet gelijk of hoger zijn dan van).");
  if (tot - van > 200) return alert("Maximaal 200 huisnummers in één keer.");
  const keuze = $("f4").value;
  const toevs = ($("f5").value || "").split(",").map(t => t.trim().toUpperCase()).filter(Boolean);
  const nieuw = [];
  for (let n = van; n <= tot; n++) {
    if (keuze === "even" && n % 2 !== 0) continue;
    if (keuze === "oneven" && n % 2 === 0) continue;
    if (toevs.length) toevs.forEach(t => nieuw.push({ nr: n, toev: t }));
    else nieuw.push({ nr: n, toev: "" });
  }
  if (!nieuw.length) return alert("Geen huisnummers over met deze keuze.");
  for (const x of nieuw) {
    if (c.adressen.some(a => a.straat === straat && a.nr === x.nr && (a.toev || "") === x.toev)) continue;
    c.adressen.push({ id: uid(), straat, nr: x.nr, toev: x.toev, klaar: false, opmerkingen: [], afspraak: null });
  }
  bewaarState();
  go({ s: "complex", c: c.id });
}

/* Tijden per 10 minuten, van 07:00 tot 21:00. Tijden die op die dag al bezet zijn, staan uit. */
function tijdKeuzes(sel, datum, aId) {
  const bezet = [];
  for (const c of st.complexen) for (const x of c.adressen) {
    if (x.id === aId || !x.afspraak) continue;
    const s = new Date(x.afspraak.start).getTime();
    bezet.push([s, x.afspraak.eindMs || s + 15 * 60000]);
  }
  const vrij = [];
  for (let m = 7 * 60; m <= 21 * 60; m += 10) {
    const t = `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
    const ms = datum ? new Date(`${datum}T${t}:00`).getTime() : NaN;
    const isBezet = !isNaN(ms) && bezet.some(([s, e]) => ms >= s && ms < e);
    vrij.push({ t, isBezet });
  }
  const keuze = vrij.find(x => x.t === sel && !x.isBezet) ? sel : ((vrij.find(x => !x.isBezet) || { t: "" }).t);
  return vrij.map(x => `<option value="${x.t}" ${x.t === keuze ? "selected" : ""} ${x.isBezet ? "disabled" : ""}>${x.t}${x.isBezet ? " (bezet)" : ""}</option>`).join("");
}
function vulTijden(aId) {
  if (!$("afTijd")) return;
  $("afTijd").innerHTML = tijdKeuzes($("afTijd").value, $("afDatum").value, aId);
}
/* Wie maakt de afspraak: naam, voorletters en vaste kleur van het ingelogde account */
function eigenaar() {
  const acc = accounts()[0];
  const naam = (acc && (acc.name || acc.username)) || "Onbekend";
  const ini = naam.split(/\s+/).filter(Boolean).map(w => w[0]).join("").slice(0, 2).toUpperCase() || "?";
  const kleuren = ["#2563eb", "#7c3aed", "#db2777", "#0d9488", "#ea580c", "#4f46e5"];
  let hash = 0;
  for (const ch of naam) hash = (hash * 31 + ch.charCodeAt(0)) % 997;
  return { naam, ini, kleur: kleuren[hash % kleuren.length] };
}
function badge(d) {
  if (!d) return `<span class="init" style="background:#9ca3af" title="Onbekend">?</span>`;
  return `<span class="init" style="background:${d.kleur}" title="${esc(d.naam)}">${esc(d.ini)}</span>`;
}

/* Plattegrond met stipjes en aantekeningen (alleen op dit toestel) */
function vDoc(d) {

  });

async function platTik(ev, dId) {

  const y = +((ev.clientY - r.top) / r.height * 100).toFixed(2);
  const tekst = prompt("Aantekening bij deze stip:");
  if (!tekst || !tekst.trim()) return;
  d.stipjes = [...(d.stipjes || []), { id: uid(), x, y, tekst: tekst.trim() }];

/* Verplaatst de complexmap op OneDrive. Alleen als de map bestaat; bij andere fouten stopt het. */
async function verplaatsComplexmap(c, naar) {
  const oud = mapVan(c);
  const enc = pad => pad.split("/").map(encodeURIComponent).join("/");
  let item = null;
  try { item = await graph(`/me/drive/root:/${enc(oud)}`, {}, true); }
  catch (e) { if (!String(e.message).startsWith("Graph 404")) throw e; item = null; }
  if (item) {
    const doelMap = naar.split("/").slice(0, -1).join("/");
    await zorgMap(doelMap, true);
    await graph(`/me/drive/items/${item.id}`, {
      method: "PATCH", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: naar.split("/").pop(), parentReference: { path: "/drive/root:/" + doelMap } })
    }, true);
  }
  c.map = naar;
}
/* Complex afvinken = archiveren (map naar "Geargiveerde projecten"); weer aanvinken = terugzetten */
function complexKlaarZet(cId, aan) {
  const c = findC(cId);
  const nietOp = FOTOS.filter(f => f.complexId === cId && !f.uploaded).length
    + DOCS.filter(d => d.complexId === cId && !d.uploaded).length;
  if (nietOp) { alert(`Er staan nog ${nietOp} foto('s) of document(en) die niet op OneDrive staan. Eerst uploaden, daarna archiveren.`); return render(); }
  const laatste = mapVan(c).split("/").pop();
  const vraag = aan
    ? `Complex "${c.naam}" afronden en verplaatsen naar "Geargiveerde projecten" op OneDrive?`
    : `Complex "${c.naam}" terugzetten naar de actieve lijst en de map terugzetten?`;
  if (!confirm(vraag)) return render();
  (async () => {
    try {
      await verplaatsComplexmap(c, aan ? `Geargiveerde projecten/${laatste}` : `${CFG.map}/${laatste}`);
    } catch (e) {
      alert("Verplaatsen mislukt: " + e.message + "\n\nHet complex blijft staan waar het stond.");
      return render();
    }
    c.gearchiveerd = aan;
    bewaarState();
    render();
  })();
}

/* Toont de mappen met zoekfilter en sortering (A–Z of laatst gewijzigd) */

  const el = $("mapLijst"); if (!el) return;
  const zoek = (view.zoek || "").toLowerCase();
  const lijst = MAPRAW.filter(m => m.name.toLowerCase().includes(zoek));
  const s = view.sort || "naam";
  if (s === "nieuw") lijst.sort((a, b) => b.mod.localeCompare(a.mod));
  else if (s === "omgekeerd") lijst.sort((a, b) => b.name.localeCompare(a.name, "nl", { numeric: true }));
  else lijst.sort((a, b) => a.name.localeCompare(b.name, "nl", { numeric: true }));
  MAPNAMEN = lijst.map(m => m.name);
  el.innerHTML = MAPNAMEN.length
    ? MAPNAMEN.map((n, i) => `<button class="sec" style="text-align:left" onclick="mapOpen(${i})">📁 ${esc(n)}</button>`).join("")
    : `<p class="klein-tekst">Geen mappen gevonden${zoek ? " voor “" + esc(view.zoek) + "”" : ""}.</p>`;

      <option value="oneven">Alleen oneven</option>
    </select>
    <label for="f5">Toevoegingen (optioneel)</label>
    <input id="f5" placeholder="bijv. A,B,C of leeg" autocomplete="off">
    <p class="klein-tekst">Met toevoegingen krijg je bijv. 12A, 12B, 12C. Leeg = geen toevoeging.</p>
    <button onclick="bewaarNieuwAdres()">Toevoegen</button>`;
}

/* ===== RENDER ===== */
async function render() {
  try {
    FOTOS = await Promise.race([
      fotosAll(),
      new Promise((_, rej) => setTimeout(() => rej(new Error("time-out")), 4000))
    ]);
    $("opslagmelding")?.remove();
  } catch (e) {
    console.error(e);
    FOTOS = [];
    if (!$("opslagmelding")) {
      const m = document.createElement("div");
      m.id = "opslagmelding";
      m.className = "melding";
      m.textContent = "Foto-opslag van dit toestel reageert niet. Gebruik Safari of Chrome gewoon (niet privé) en probeer opnieuw. Laat het me weten als dit blijft gebeuren.";
      document.body.insertBefore(m, document.body.firstChild);
    }
  }
  DOCS = await docsAll().catch(() => []);
  URLS.forEach(u => URL.revokeObjectURL(u)); URLS = [];

  let titel = "Complexen", inhoud = "", c = null, a = null;
  if (view.c) c = findC(view.c);
  if (view.a && c) a = findA(c, view.a);

  if (view.s === "complexen") inhoud = vComplexen();
  else if (view.s === "complex" && c) { titel = c.naam; inhoud = vComplex(c); laadAdresMappen(c.id); }
  else if (view.s === "adres" && c && a) { titel = `${a.straat} ${nrLabel(a)}`; inhoud = vAdres(c, a); }
  else if (view.s === "nieuwComplex") { titel = "Nieuw complex"; inhoud = vNieuwComplex(); }
  else if (view.s === "map" && c) { titel = "Map kiezen"; inhoud = vMap(c); }
  else if (view.s === "pasjes") { titel = "Bedrijfspasjes"; inhoud = vPasjes(); }
  else if (view.s === "pas") { const p = PASJES.find(x => x.id === view.p); titel = "Bedrijfspasje"; inhoud = p ? vPasGroot(p) : vPasjes(); }
  else if (view.s === "doc") { const d = DOCS.find(x => x.id === view.d); titel = "Plattegrond"; inhoud = d ? vDoc(d) : vComplexen(); }
  else if (view.s === "nieuwMap") { titel = "Map kiezen"; inhoud = vNieuwMap(); }
  else if (view.s === "nieuwAdres" && c) { titel = "Huisnummers"; inhoud = vNieuwAdres(c); }
  else { view = { s: "complexen" }; inhoud = vComplexen(); }

  const ingelogd = accounts().length > 0;
  if (!ingelogd) {
    $("titel").textContent = "Inloggen";
    $("terugknop").style.display = "none";
    $("app").innerHTML = `<div class="kaart" style="text-align:center;margin-top:24px">
      <h2>Log in om verder te gaan</h2>
      <p class="klein-tekst">Foto's worden opgeslagen in OneDrive van je eigen Microsoft-account. Zonder inloggen is de app niet beschikbaar.</p>
      ${pca ? `<button onclick="login()">Inloggen met Microsoft</button>`
            : `<div class="melding">Inloggen kan nu niet worden geladen. Controleer je internetverbinding en herlaad de pagina.</div>`}
    </div>`;
    $("balk").innerHTML = "";
    return;
  }

  $("titel").textContent = titel;
  $("terugknop").style.display = view.s === "complexen" ? "none" : "block";
  $("app").innerHTML = inhoud;
  if (view.s === "map" || view.s === "nieuwMap") mapLaad();

  const wacht = FOTOS.filter(f => !f.uploaded).length;
  $("balk").innerHTML = `
    <div class="acties">
      <span class="klein-tekst" style="flex:1;font-size:11px;line-height:1.3">${wacht} foto's wachten op OneDrive · ${FOTOS.length - wacht} op OneDrive</span>
      ${ingelogd
        ? `<button class="klein" onclick="sync(true)">Nu uploaden</button>`
        : `<button class="klein" onclick="login()">Inloggen</button>`}
    </div>
    ${SYNC_FOUT ? `<div class="melding">Opslaan op OneDrive lukt niet: ${esc(SYNC_FOUT)}. Tik op "Nu uploaden". Je foto's blijven op dit toestel.</div>` : ""}
    ${("Notification" in window && Notification.permission === "default") ? `<button class="klein sec" onclick="meldingenAan()">🔔 Meldingen aanzetten</button>` : ""}
    ${navigator.onLine ? "" : `<div class="melding">Geen internet. Foto's blijven bewaard en worden later geüpload.</div>`}
    ${window.PERSISTENT ? "" : `<div class="klein-tekst">⚠ Opslag van dit toestel is niet vastgezet. Upload regelmatig naar OneDrive.</div>`}
    <div class="klein-tekst" style="text-align:center;padding-top:4px;font-size:10px">Deze app is eigendom van Erkend-energielabel.nl</div>
  `;
}

/* ===== START ===== */
(async () => {
  try { if (pca) await pca.handleRedirectPromise(); } catch (e) { console.error(e); }
  window.PERSISTENT = !!(navigator.storage && navigator.storage.persist && await navigator.storage.persist().catch(() => false));
  await render();
  controleerAfspraken();
  setInterval(() => { controleerAfspraken(); updateAftel(); }, 30000);
  /* Elke minuut ophalen wat op andere toestellen is veranderd. Niet verversen als er getypt wordt. */
  setInterval(async () => {
    try {
      const nieuw = await gedeeldSync(false);
      if (nieuw && !document.activeElement?.matches?.("input,textarea,select")) render();
    } catch (e) { console.warn("gedeelde sync", e); }
  }, 60000);
  window.addEventListener("online", () => { render(); sync(false); });
  if (navigator.onLine) sync(false);
})();
</script>
</body>
</html>
