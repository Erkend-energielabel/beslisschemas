<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DLB Opname</title>
<meta name="theme-color" content="#231f20">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="DLB Opname">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#231f20; --ink2:#4a4546; --mute:#8a8687; --line:#e3e5df; --bg:#f4f5f1; --card:#fff;
  --green:#88bd6a; --lime:#9aeb04; --green-d:#5d8f42; --red:#d83a2e; --amber:#e8a317;
  --stencil:'Saira Stencil One', 'Arial Black', system-ui, sans-serif;
  --sans:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --r:14px; --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans);-webkit-text-size-adjust:100%}
body{min-height:100vh;padding-bottom:calc(84px + var(--sb))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
a{color:var(--green-d)}
.hidden{display:none!important}

/* header */
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:3px solid var(--green);padding:calc(var(--st) + 8px) 14px 8px;display:flex;align-items:center;gap:10px}
.top img.logo{height:34px;display:block}
.top .ttl{font-family:var(--stencil);font-size:20px;letter-spacing:.5px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .back{font-size:26px;line-height:1;padding:2px 8px 2px 0;color:var(--ink)}
.top .act{font-size:22px;padding:4px 6px}
.swoosh{height:4px;background:linear-gradient(90deg,var(--lime),var(--green))}

main{padding:14px;max-width:760px;margin:0 auto}
h2{font-family:var(--stencil);font-weight:400;font-size:22px;margin:18px 0 10px;letter-spacing:.4px}
h3{font-size:15px;margin:16px 0 8px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink2)}
.muted{color:var(--mute)} .small{font-size:13px}

.card{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:0 1px 0 var(--line),0 1px 8px rgba(35,31,32,.04);margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 14px;border-radius:11px;background:var(--ink);color:#fff;font-weight:600;font-size:14px}
.btn.lime{background:var(--lime);color:var(--ink)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.danger{background:#fff;color:var(--red);box-shadow:inset 0 0 0 1.5px #f1c9c5}
.btn.sm{padding:7px 10px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.45}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line);font-size:13px;font-weight:500;white-space:nowrap}
.chip.on{background:var(--ink);color:#fff;box-shadow:none}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;text-transform:uppercase;letter-spacing:.4px;background:#eef0ea;color:var(--ink2)}
.badge.ok{background:#e9f6dc;color:var(--green-d)} .badge.busy{background:#fff4d6;color:#8a6200} .badge.err{background:#fde3e0;color:var(--red)}

/* list */
.search{width:100%;padding:11px 14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;outline:none}
.search:focus{border-color:var(--green)}
.rec-item{display:flex;gap:12px;align-items:center}
.rec-ico{width:42px;height:42px;border-radius:12px;background:var(--ink);color:var(--lime);display:grid;place-items:center;font-size:19px;flex:none}
.rec-item .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec-item .m{font-size:12.5px;color:var(--mute)}
.empty{text-align:center;padding:40px 20px;color:var(--mute)}
.empty .big{font-family:var(--stencil);font-size:24px;color:var(--ink);margin-bottom:6px}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;padding:6px 8px calc(6px + var(--sb))}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--mute);padding:4px 10px;min-width:64px}
.tabbar button .i{font-size:21px;line-height:1}
.tabbar button.on{color:var(--ink)}
.tabbar .recbtn{width:62px;height:62px;border-radius:50%;background:var(--ink);margin-top:-26px;box-shadow:0 0 0 5px #fff,0 6px 18px rgba(0,0,0,.18);display:grid;place-items:center;min-width:0;padding:0}
.tabbar .recbtn span{width:22px;height:22px;border-radius:50%;background:var(--lime)}

/* record screen */
.recscreen{position:fixed;inset:0;z-index:50;background:var(--ink);color:#fff;display:flex;flex-direction:column;padding:calc(var(--st) + 14px) 18px calc(var(--sb) + 18px)}
.recscreen .hd{display:flex;align-items:center;justify-content:space-between}
.recscreen .hd img{height:26px;filter:invert(1) hue-rotate(180deg) brightness(1.2);mix-blend-mode:lighten}
.recscreen .state{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;display:flex;align-items:center;gap:7px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 0 rgba(154,235,4,.7);animation:pulse 1.4s infinite}
.paused .dot{animation:none;background:var(--amber)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(154,235,4,.6)}70%{box-shadow:0 0 0 12px rgba(154,235,4,0)}100%{box-shadow:0 0 0 0 rgba(154,235,4,0)}}
.timer{font-family:var(--stencil);font-size:60px;text-align:center;margin:12px 0 4px;letter-spacing:2px}
.rec-type{display:flex;justify-content:center;gap:8px;margin-bottom:8px}
.rec-type .chip{background:transparent;color:#cfcfcf;box-shadow:inset 0 0 0 1.5px #4a4546}
.rec-type .chip.on{background:var(--lime);color:var(--ink);box-shadow:none}
canvas.wave{width:100%;height:90px;display:block;margin:6px 0}
.rec-notes{min-height:60px}
.rec-notes{flex:1;overflow:auto;margin:6px 0;font-size:14px}
.rec-notes .n{background:#2f2a2b;border-radius:10px;padding:8px 11px;margin-bottom:6px}
.rec-notes .n b{color:var(--lime);font-weight:600;margin-right:6px}
.rec-ctrl{display:flex;justify-content:space-around;align-items:center;margin-top:10px}
.rc{display:flex;flex-direction:column;align-items:center;gap:6px;color:#ddd;font-size:12px;font-weight:600}
.rc .c{width:58px;height:58px;border-radius:50%;background:#3a3536;display:grid;place-items:center;font-size:23px;color:#fff}
.rc.stop .c{width:78px;height:78px;background:#fff}
.rc.stop .c span{width:28px;height:28px;border-radius:6px;background:var(--red)}
.rc.hl .c{background:var(--lime);color:var(--ink)}
.flash{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);background:var(--lime);color:var(--ink);padding:10px 18px;border-radius:999px;font-weight:700;z-index:90;pointer-events:none;animation:fl 1s forwards}
@keyframes fl{0%{opacity:0;transform:translate(-50%,-30%)}20%{opacity:1;transform:translate(-50%,-50%)}80%{opacity:1}100%{opacity:0}}
.warn{background:#3a3536;border-left:3px solid var(--amber);padding:8px 10px;border-radius:8px;font-size:12.5px;color:#e8e3e3}

/* detail */
.meta{color:var(--mute);font-size:13px;margin:-4px 0 12px}
.player{position:sticky;top:calc(var(--st) + 56px);z-index:15}
.player .row{gap:8px}
.pbtn{width:44px;height:44px;border-radius:50%;background:var(--ink);color:var(--lime);font-size:18px;display:grid;place-items:center;flex:none}
.skip{font-size:12px;font-weight:700;padding:6px 6px;color:var(--ink2)}
input[type=range]{width:100%;accent-color:var(--green-d)}
.ptime{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums;display:flex;justify-content:space-between}
.speed{font-size:12px;font-weight:700;padding:4px 8px;border-radius:8px;background:#eef0ea}
.tabs{display:flex;gap:4px;background:#e8eae4;padding:4px;border-radius:12px;margin:4px 0 12px}
.tabs button{flex:1;padding:8px 4px;border-radius:9px;font-weight:600;font-size:13.5px;color:var(--ink2)}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}

.line{display:flex;gap:10px;padding:9px 6px;border-radius:10px}
.line.cur{background:#f0f8e6}
.line .av{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff}
.line .who{font-size:12.5px;font-weight:700}
.line .ts{font-size:11.5px;color:var(--mute);margin-left:6px;font-variant-numeric:tabular-nums}
.line .tx{margin-top:1px}
.line .tx[contenteditable=true]{background:#fffbe6;outline:1.5px dashed var(--amber);border-radius:6px;padding:2px 4px}
.line.hl{box-shadow:inset 3px 0 0 var(--lime)}
.tlink{color:var(--green-d);font-weight:600;cursor:pointer;font-variant-numeric:tabular-nums;white-space:nowrap}

.md h1{font-family:var(--stencil);font-weight:400;font-size:22px;margin:4px 0 10px;border-bottom:3px solid var(--green);padding-bottom:4px}
.md h2{font-family:var(--sans);font-weight:700;font-size:17px;margin:18px 0 6px;letter-spacing:0}
.md h3{font-size:14px;margin:14px 0 6px}
.md p{margin:6px 0}
.md ul,.md ol{margin:6px 0;padding-left:22px}
.md li{margin:3px 0}
.md li.task{list-style:none;margin-left:-20px}
.md table{border-collapse:collapse;width:100%;font-size:13.5px;margin:8px 0;display:block;overflow-x:auto}
.md th{background:var(--ink);color:#fff;text-align:left;font-weight:600}
.md th,.md td{padding:6px 8px;border:1px solid var(--line);vertical-align:top}
.md tr:nth-child(even) td{background:#f7f8f4}
.md blockquote{margin:8px 0;padding:6px 12px;border-left:3px solid var(--green);background:#f5f9f0;border-radius:0 8px 8px 0}
.md code{background:#eef0ea;padding:1px 5px;border-radius:5px;font-size:13px}
.md hr{border:0;border-top:1px solid var(--line);margin:14px 0}

/* mindmap */
.mm{overflow-x:auto;padding:6px 0 10px}
.mm ul{list-style:none;margin:0;padding-left:22px;position:relative}
.mm>ul{padding-left:0}
.mm li{position:relative;padding:4px 0 4px 14px}
.mm li::before{content:'';position:absolute;left:0;top:0;bottom:0;border-left:2px solid var(--green)}
.mm li:last-child::before{bottom:50%}
.mm li::after{content:'';position:absolute;left:0;top:50%;width:12px;border-top:2px solid var(--green)}
.mm>ul>li{padding-left:0}.mm>ul>li::before,.mm>ul>li::after{display:none}
.mm .node{display:inline-block;padding:5px 10px;border-radius:9px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line);font-size:13.5px}
.mm>ul>li>.node{background:var(--ink);color:#fff;font-family:var(--stencil);font-size:17px;box-shadow:none}
.mm>ul>li>ul>li>.node{background:#eef7e2;box-shadow:inset 0 0 0 1.5px var(--green);font-weight:600}

/* chat */
.msg{margin:8px 0;display:flex}
.msg .b{max-width:88%;padding:9px 12px;border-radius:14px;background:#fff;box-shadow:0 1px 0 var(--line)}
.msg.u{justify-content:flex-end}.msg.u .b{background:var(--ink);color:#fff}
.chatin{display:flex;gap:8px;position:sticky;bottom:calc(84px + var(--sb));background:var(--bg);padding:8px 0}
.chatin textarea{flex:1;resize:none;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;min-height:44px;max-height:140px;outline:none;background:#fff}
.chatin textarea:focus{border-color:var(--green)}

/* forms */
label.f{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin:10px 0 4px}
.inp{width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:#fff;outline:none}
.inp:focus{border-color:var(--green)}
textarea.inp{min-height:90px;resize:vertical}
.hint{font-size:12px;color:var(--mute);margin-top:4px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0}
.tgl{appearance:none;width:46px;height:28px;border-radius:999px;background:#d9dbd5;position:relative;flex:none;transition:.2s}
.tgl::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tgl:checked{background:var(--green-d)}.tgl:checked::after{left:21px}

/* sheet / modal */
.ov{position:fixed;inset:0;background:rgba(20,18,18,.45);z-index:70;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:760px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(var(--sb) + 18px)}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:#cfd2ca;margin:0 auto 10px}
.tpl{display:flex;gap:12px;align-items:center;padding:12px;background:#fff;border-radius:12px;margin-bottom:8px;text-align:left;width:100%}
.tpl .e{font-size:22px;width:32px;text-align:center}
.tpl .n{font-weight:600}.tpl .d{font-size:12.5px;color:var(--mute)}
.toast{position:fixed;left:50%;bottom:calc(100px + var(--sb));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;z-index:95;font-size:14px;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.prog{height:6px;border-radius:9px;background:#e6e8e2;overflow:hidden;margin:8px 0}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--lime),var(--green));transition:width .3s}
.spin{display:inline-block;width:16px;height:16px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}
.banner{background:#fff;border:1.5px solid var(--green);border-radius:12px;padding:10px 12px;font-size:13.5px;margin-bottom:12px}

/* print */
#print{display:none}
@media print{
  body>*:not(#print){display:none!important}
  #print{display:block;padding:0;color:#231f20;font:11pt/1.45 Calibri,Arial,sans-serif}
  #print .ph{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #88bd6a;padding-bottom:8px;margin-bottom:14px}
  #print .ph img{height:52px}
  #print .pf{margin-top:24px;border-top:1px solid #ccc;padding-top:6px;font-size:8.5pt;color:#666}
  #print h1{font-size:18pt;margin:0 0 8px} #print h2{font-size:13pt;color:#231f20;margin:14px 0 4px} #print table{border-collapse:collapse;width:100%}
  #print th{background:#231f20;color:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact} #print th,#print td{border:1px solid #bbb;padding:4px 6px;text-align:left;vertical-align:top}
  @page{margin:16mm 16mm 18mm}
}
</style>
</head>
<body>
<header class="top" id="top"></header>
<div class="swoosh"></div>
<main id="app"></main>
<nav class="tabbar" id="tabbar">
  <button data-go="#/" id="tb-home"><span class="i">☰</span>Opnames</button>
  <button data-go="#/ask" id="tb-ask"><span class="i">✦</span>Vraag</button>
  <button class="recbtn" id="tb-rec" aria-label="Opname starten"><span></span></button>
  <button data-go="#/import" id="tb-imp"><span class="i">⇪</span>Importeer</button>
  <button data-go="#/settings" id="tb-set"><span class="i">⚙</span>Instellingen</button>
</nav>
<div id="print"></div>
<input type="file" id="fileAudio" accept="audio/*,video/*,.m4a,.mp3,.wav,.aac,.mp4,.mov,.caf,.ogg,.webm" class="hidden">
<input type="file" id="filePhoto" accept="image/*" multiple class="hidden">
<input type="file" id="fileBackup" accept="application/json,.json" class="hidden">

<script>
'use strict';
/* =========================================================
   DLB Opname — De Laat Bouwbegeleiding
   Opnemen · Transcriberen (met sprekers) · Samenvatten · Vragen
   Alles lokaal op het toestel (IndexedDB); API-sleutels alleen
   naar de gekozen aanbieder (Google Gemini / ElevenLabs / Anthropic).
   ========================================================= */
const APP_VERSION = '1.0.0';
const COMPANY = {
  name: 'De Laat Bouwbegeleiding',
  addr: 'Aelbert Cuyplaan 45, 3343 DA Hendrik-Ido-Ambacht',
  tel: '06 51 63 08 96', mail: 'info@delaatbouwbegeleiding.nl', web: 'www.delaatbouwbegeleiding.nl', kvk: '76790606'
};

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
function fmtT(sec) {
  sec = Math.max(0, Math.floor(sec || 0));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  return (h ? h + ':' + String(m).padStart(2, '0') : String(m).padStart(2, '0')) + ':' + String(s).padStart(2, '0');
}
function fmtDur(sec) {
  sec = Math.round(sec || 0); const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60);
  if (h) return `${h} u ${m} min`; if (m) return `${m} min`; return `${sec} s`;
}
const fmtDate = (ts) => new Date(ts).toLocaleString('nl-NL', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
const fmtDateLong = (ts) => new Date(ts).toLocaleString('nl-NL', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' });
function parseTs(v) {
  if (typeof v === 'number') return v;
  const p = String(v || '0').trim().replace(/[^\d:.]/g, '').split(':').map(Number);
  if (p.some(isNaN)) return 0;
  return p.reduce((a, b) => a * 60 + b, 0);
}
function toast(msg, ms = 2600) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), ms);
}
function flash(msg) { const f = document.createElement('div'); f.className = 'flash'; f.textContent = msg; document.body.appendChild(f); setTimeout(() => f.remove(), 1000); }
const blobToB64 = (blob) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(blob); });
const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isStandalone = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const SPK_COLORS = ['#231f20', '#5d8f42', '#2f6fae', '#b5651d', '#7b4fa0', '#c0392b', '#138d75', '#8a6200'];

/* ---------- settings ---------- */
const DEFAULTS = {
  userName: 'Jacob', sttProvider: 'gemini', llmProvider: 'gemini',
  geminiKey: '', elevenKey: '', anthropicKey: '',
  geminiModel: 'gemini-flash-latest', claudeModel: 'claude-sonnet-5-5', elevenModel: 'scribe_v2',
  lang: 'nl', glossary: 'De Laat Bouwbegeleiding, Erkend-Energielabel, EPA, NTA 8800, ISSO 82.1, Rc-waarde, HR++, warmtepomp, rookgasafvoer, VvE, uitvoerder, bouwbegeleiding, oplevering, meerwerk, minderwerk, bestek, termijnstaat, VCA, VGM, Bouwbesluit, Bbl',
  autoTranscribe: true, autoSummary: true, defaultTemplate: 'algemeen', autoTitle: true, segMinutes: 15
};
const S = Object.assign({}, DEFAULTS, (() => { try { return JSON.parse(localStorage.getItem('dlb-settings') || '{}'); } catch { return {}; } })());

/* ---------- IndexedDB ---------- */
const DB = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('dlb-opname', 1);
      r.onupgradeneeded = () => {
        const d = r.result;
        d.createObjectStore('recs', { keyPath: 'id' });
        d.createObjectStore('blobs');
        d.createObjectStore('chunks', { keyPath: ['rid', 'seg', 'n'] });
        d.createObjectStore('templates', { keyPath: 'id' });
      };
      r.onsuccess = () => { this.db = r.result; res(); };
      r.onerror = () => rej(r.error);
    });
  },
  tx(store, mode, fn) {
    return new Promise((res, rej) => {
      const t = this.db.transaction(store, mode); const st = t.objectStore(store); let out;
      const rq = fn(st); if (rq) rq.onsuccess = () => { out = rq.result; };
      t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error || new Error('Opslag afgebroken (vol?)'));
    });
  },
  get(s, k) { return this.tx(s, 'readonly', (st) => st.get(k)); },
  put(s, v, k) { return this.tx(s, 'readwrite', (st) => (k === undefined ? st.put(v) : st.put(v, k))); },
  del(s, k) { return this.tx(s, 'readwrite', (st) => st.delete(k)); },
  all(s) { return this.tx(s, 'readonly', (st) => st.getAll()); },
  delRange(s, range) { return this.tx(s, 'readwrite', (st) => st.delete(range)); },
};
async function updateRec(id, fn) {
  const r = await DB.get('recs', id); if (!r) return null;
  await fn(r); r.updatedAt = Date.now(); await DB.put('recs', r); return r;
}

/* ---------- markdown renderer ---------- */
function inlineMd(s) {
  s = esc(s);
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>');
  s = s.replace(/\[(\d{1,2}:\d{2}(?::\d{2})?)\]/g, (m, t) => `<span class="tlink" data-t="${parseTs(t)}">[${t}]</span>`);
  return s;
}
function md(src) {
  const lines = String(src || '').replace(/\r/g, '').split('\n'); let out = ''; let i = 0;
  const listStack = [];
  const closeLists = (lvl = -1) => { while (listStack.length && listStack[listStack.length - 1].lvl > lvl) out += `</${listStack.pop().tag}>`; };
  while (i < lines.length) {
    const l = lines[i];
    if (/^\s*\|.*\|\s*$/.test(l) && i + 1 < lines.length && /^\s*\|?\s*:?-{2,}/.test(lines[i + 1])) {
      closeLists();
      const cells = (r) => r.trim().replace(/^\||\|$/g, '').split('|').map((c) => c.trim());
      out += '<table><thead><tr>' + cells(l).map((c) => `<th>${inlineMd(c)}</th>`).join('') + '</tr></thead><tbody>';
      i += 2;
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) { out += '<tr>' + cells(lines[i]).map((c) => `<td>${inlineMd(c)}</td>`).join('') + '</tr>'; i++; }
      out += '</tbody></table>'; continue;
    }
    let m;
    if ((m = l.match(/^(#{1,4})\s+(.*)/))) { closeLists(); const n = Math.min(m[1].length, 3); out += `<h${n}>${inlineMd(m[2])}</h${n}>`; }
    else if ((m = l.match(/^(\s*)([-*+]|\d+[.)])\s+(.*)/))) {
      const lvl = Math.floor(m[1].replace(/\t/g, '  ').length / 2); const tag = /\d/.test(m[2]) ? 'ol' : 'ul';
      closeLists(lvl);
      if (!listStack.length || listStack[listStack.length - 1].lvl < lvl) { out += `<${tag}>`; listStack.push({ lvl, tag }); }
      let txt = m[3]; let cls = '';
      const tk = txt.match(/^\[( |x|X)\]\s+(.*)/);
      if (tk) { cls = ' class="task"'; txt = (tk[1] === ' ' ? '☐ ' : '☑ ') + tk[2]; }
      out += `<li${cls}>${inlineMd(txt)}</li>`;
    }
    else if (/^\s*>\s?/.test(l)) { closeLists(); out += `<blockquote>${inlineMd(l.replace(/^\s*>\s?/, ''))}</blockquote>`; }
    else if (/^\s*(---|\*\*\*)\s*$/.test(l)) { closeLists(); out += '<hr>'; }
    else if (!l.trim()) { closeLists(); }
    else { closeLists(); out += `<p>${inlineMd(l)}</p>`; }
    i++;
  }
  closeLists();
  return out;
}
function mindmapHtml(src) {
  const items = String(src || '').split('\n').map((l) => { const m = l.match(/^(\s*)[-*+]\s+(.*)/); return m ? { lvl: Math.floor(m[1].replace(/\t/g, '  ').length / 2), t: m[2].replace(/\*\*/g, '') } : null; }).filter(Boolean);
  if (!items.length) return '<div class="md">' + md(src) + '</div>';
  let html = '<div class="mm"><ul>'; let cur = 0; let first = true;
  for (const it of items) {
    if (first) { cur = it.lvl; first = false; html += `<li><span class="node">${esc(it.t)}</span>`; continue; }
    if (it.lvl > cur) { html += '<ul>'.repeat(it.lvl - cur); }
    else { html += '</li>'; if (it.lvl < cur) html += '</ul></li>'.repeat(cur - it.lvl); }
    html += `<li><span class="node">${esc(it.t)}</span>`; cur = it.lvl;
  }
  html += '</li>' + '</ul></li>'.repeat(Math.max(0, cur - items[0].lvl)) + '</ul></div>';
  return html;
}

/* =========================================================
   RECORDER  (segment-rotatie + chunk-opslag = crashbestendig)
   ========================================================= */
const R = {
  a: null,
  pickMime() {
    const c = ['audio/mp4;codecs=mp4a.40.2', 'audio/mp4', 'audio/aac', 'audio/webm;codecs=opus', 'audio/webm'];
    if (!window.MediaRecorder) return '';
    return c.find((t) => { try { return MediaRecorder.isTypeSupported(t); } catch { return false; } }) || '';
  },
  async getStream() {
    return navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 } });
  },
  async start(type = 'gesprek') {
    if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) throw new Error('Opnemen wordt niet ondersteund in deze browser.');
    const stream = await this.getStream();
    const id = uid(); const now = Date.now();
    const rec = { id, title: 'Opname ' + new Date(now).toLocaleString('nl-NL', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }),
      createdAt: now, updatedAt: now, type, duration: 0, segments: [], highlights: [], notes: [], photos: [], transcript: null, speakers: {}, summaries: [], chat: [], status: 'recording' };
    await DB.put('recs', rec);
    this.a = { id, rec, stream, doneSecs: 0, segIdx: 0, paused: false, mr: null };
    this.setupMeter(stream); this.wake(); this.watchTrack();
    this.newSegment();
    try { navigator.storage?.persist?.(); } catch {}
    return id;
  },
  newSegment() {
    const a = this.a; if (!a) return;
    const mime = this.pickMime(); const opts = { audioBitsPerSecond: 48000 }; if (mime) opts.mimeType = mime;
    let mr; try { mr = new MediaRecorder(a.stream, opts); } catch { mr = new MediaRecorder(a.stream); }
    const segIdx = a.segIdx; const start = a.doneSecs; let n = 0; const pending = [];
    a.mr = mr; a.mime = mr.mimeType || mime || 'audio/mp4'; a.segStartWall = Date.now(); a.segStart = start; a.pending = pending;
    mr.ondataavailable = (e) => {
      if (e.data && e.data.size) pending.push(DB.put('chunks', { rid: a.id, seg: segIdx, n: n++, blob: e.data, mime: a.mime, start }).catch((err) => console.warn(err)));
    };
    mr.onerror = (e) => { console.warn('MediaRecorder error', e); this.recover('fout'); };
    mr.start(4000);
    clearTimeout(a.rot); a.rot = setTimeout(() => this.rotate(), segSeconds() * 1000);
  },
  async stopSegment() {
    const a = this.a; if (!a || !a.mr) return;
    clearTimeout(a.rot);
    const mr = a.mr; const segIdx = a.segIdx; const start = a.segStart; const mime = a.mime; const pending = a.pending;
    const dur = (Date.now() - a.segStartWall) / 1000;
    a.mr = null;
    await new Promise((res) => {
      if (mr.state === 'inactive') return res();
      const to = setTimeout(res, 3000);
      mr.addEventListener('stop', () => { clearTimeout(to); res(); }, { once: true });
      try { mr.stop(); } catch { clearTimeout(to); res(); }
    });
    await sleep(60); await Promise.all(pending);
    const seg = await assembleSegment(a.id, segIdx, start, dur, mime);
    a.doneSecs += dur; a.segIdx++;
    a.rec = await updateRec(a.id, (r) => { if (seg && !r.segments.some((s) => s.idx === seg.idx)) r.segments.push(seg); r.duration = a.doneSecs; }) || a.rec;
  },
  async rotate() { if (!this.a || this.a.paused) return; await this.stopSegment(); if (this.a && !this.a.paused) this.newSegment(); },
  async pause() { if (!this.a || this.a.paused) return; this.a.paused = true; await this.stopSegment(); },
  async resume() {
    const a = this.a; if (!a || !a.paused) return;
    if (!a.stream.getAudioTracks().some((t) => t.readyState === 'live')) { a.stream = await this.getStream(); this.setupMeter(a.stream); this.watchTrack(); }
    a.paused = false; this.newSegment(); this.wake();
  },
  async stop() {
    const a = this.a; if (!a) return null;
    if (!a.paused) await this.stopSegment();
    a.stream.getTracks().forEach((t) => t.stop());
    cancelAnimationFrame(a.raf); try { a.ctx?.close(); } catch {}
    try { a.wl?.release(); } catch {}
    const id = a.id; this.a = null;
    await updateRec(id, (r) => { r.status = r.segments.length ? 'recorded' : 'empty'; r.duration = a.doneSecs; });
    return id;
  },
  elapsed() { const a = this.a; if (!a) return 0; return a.doneSecs + (a.mr ? (Date.now() - a.segStartWall) / 1000 : 0); },
  async addHighlight() { const a = this.a; if (!a) return; const t = this.elapsed(); a.rec = await updateRec(a.id, (r) => r.highlights.push(t)); flash('★ Highlight ' + fmtT(t)); navigator.vibrate?.(30); },
  async addNote(text) { const a = this.a; if (!a || !text.trim()) return; const t = this.elapsed(); a.rec = await updateRec(a.id, (r) => r.notes.push({ t, text: text.trim() })); },
  setupMeter(stream) {
    const a = this.a; try { a.ctx?.close(); } catch {}
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)(); ctx.resume?.();
      const src = ctx.createMediaStreamSource(stream); const an = ctx.createAnalyser(); an.fftSize = 1024; src.connect(an);
      a.ctx = ctx; a.an = an; a.levels = a.levels || [];
    } catch (e) { console.warn('meter', e); }
  },
  async wake() { try { if ('wakeLock' in navigator && document.visibilityState === 'visible') this.a.wl = await navigator.wakeLock.request('screen'); } catch {} },
  watchTrack() {
    const tr = this.a?.stream.getAudioTracks()[0]; if (!tr) return;
    tr.onended = () => { if (document.visibilityState === 'visible') this.recover('microfoon gestopt'); };
  },
  async recover(reason) {
    const a = this.a; if (!a || a.paused || a.recovering) return; a.recovering = true;
    try {
      await this.stopSegment();
      a.stream.getTracks().forEach((t) => t.stop());
      a.stream = await this.getStream(); this.setupMeter(a.stream); this.watchTrack();
      a.rec = await updateRec(a.id, (r) => r.notes.push({ t: a.doneSecs, text: `⚠ Onderbreking (${reason}) — opname automatisch hervat` }));
      this.newSegment(); this.wake(); toast('Opname hervat na onderbreking');
    } catch (e) {
      a.paused = true; toast('Opname gepauzeerd: tik op ▶ om verder te gaan'); RecUI.render();
    } finally { a.recovering = false; RecUI.render(); }
  },
};
async function assembleSegment(rid, seg, start, dur, mime) {
  const range = IDBKeyRange.bound([rid, seg, 0], [rid, seg, Number.MAX_SAFE_INTEGER]);
  const all = (await DB.tx('chunks', 'readonly', (st) => st.getAll(range))).sort((a, b) => a.n - b.n);
  if (!all.length) return null;
  const type = (all[0].mime || mime || 'audio/mp4').split(';')[0];
  const blob = new Blob(all.map((c) => c.blob), { type });
  const key = `${rid}:${seg}`;
  await DB.put('blobs', blob, key);
  await DB.delRange('chunks', IDBKeyRange.bound([rid, seg, 0], [rid, seg, Number.MAX_SAFE_INTEGER]));
  return { idx: seg, start: start ?? all[0].start ?? 0, dur, mime: type, key, size: blob.size };
}
async function recoverOrphans() {
  const chunks = await DB.all('chunks'); if (!chunks.length) return;
  const groups = {};
  for (const c of chunks) { const k = c.rid + '|' + c.seg; (groups[k] = groups[k] || []).push(c); }
  for (const k of Object.keys(groups)) {
    const [rid, segS] = k.split('|'); const seg = +segS; const g = groups[k];
    const est = g.length * 4; // ~4 s per chunk
    const s = await assembleSegment(rid, seg, g[0].start || 0, est, g[0].mime);
    let rec = await DB.get('recs', rid);
    if (!rec) rec = { id: rid, title: 'Herstelde opname', createdAt: Date.now(), type: 'gesprek', duration: 0, segments: [], highlights: [], notes: [], photos: [], transcript: null, speakers: {}, summaries: [], chat: [] };
    if (s && !rec.segments.some((x) => x.idx === s.idx)) rec.segments.push(s);
    rec.segments.sort((a, b) => a.idx - b.idx);
    rec.duration = rec.segments.reduce((m, x) => Math.max(m, x.start + x.dur), 0);
    rec.status = 'recorded'; rec.notes.push({ t: rec.duration, text: '⚠ Opname hersteld na onverwacht afsluiten van de app' });
    await DB.put('recs', rec);
  }
  toast('Onderbroken opname hersteld ✔');
}

async function errText(r) { let t = ''; try { t = await r.text(); const j = JSON.parse(t); t = j.error?.message || j.detail?.message || j.detail || j.message || t; } catch {} return `${r.status} ${typeof t === 'string' ? t.slice(0, 300) : JSON.stringify(t).slice(0, 300)}`; }

async function geminiGenerate({ contents, system, json, schema, maxTokens = 32768, temperature = 0.2 }) {
  if (!S.geminiKey) throw new Error('Geen Gemini API-sleutel ingesteld (Instellingen).');

    try {
      r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(S.geminiModel || 'gemini-flash-latest')}:generateContent`, {
        method: 'POST', headers: { 'content-type': 'application/json', 'x-goog-api-key': S.geminiKey }, body: JSON.stringify(body) });
    } catch (e) { throw netErr(e, 'Gemini'); }
    if (r.status === 429 || r.status === 503) {

      if (daily) throw new Error('Gratis daglimiet van Gemini bereikt. Morgen verder, of zet billing aan in Google AI Studio (kost dan centen per uur).');
      if (attempt < 3) { toast(`Gratis limiet: even wachten (${Math.min(wait, 65)} s)…`, 4000); await sleep(Math.min(wait, 65) * 1000); continue; }
    }
    break;
  }
  if (!r.ok) throw new Error('Gemini ' + await errText(r));
  const d = await r.json(); const c = d.candidates?.[0];
  if (!c) throw new Error('Gemini gaf geen antwoord (' + (d.promptFeedback?.blockReason || 'onbekend') + ')');
  return (c.content?.parts || []).filter((p) => !p.thought).map((p) => p.text || '').join('');
}
async function geminiUploadFile(blob, mime) {
  // Resumable upload via Files API (voor bestanden > ~18 MB)
  let r = await fetch('https://generativelanguage.googleapis.com/upload/v1beta/files', {
    method: 'POST', headers: { 'x-goog-api-key': S.geminiKey, 'X-Goog-Upload-Protocol': 'resumable', 'X-Goog-Upload-Command': 'start',
      'X-Goog-Upload-Header-Content-Length': String(blob.size), 'X-Goog-Upload-Header-Content-Type': mime, 'content-type': 'application/json' },
    body: JSON.stringify({ file: { display_name: 'dlb-opname' } }) });
  if (!r.ok) throw new Error('Gemini upload ' + await errText(r));
  const url = r.headers.get('x-goog-upload-url');
  if (!url) throw new Error('Gemini upload: browser geeft upload-URL niet vrij. Kies ElevenLabs voor lange geïmporteerde bestanden.');
  r = await fetch(url, { method: 'POST', headers: { 'X-Goog-Upload-Command': 'upload, finalize', 'X-Goog-Upload-Offset': '0' }, body: blob });
  if (!r.ok) throw new Error('Gemini upload ' + await errText(r));
  let f = (await r.json()).file;
  for (let i = 0; i < 60 && f.state === 'PROCESSING'; i++) {
    await sleep(2000);
    const g = await fetch(`https://generativelanguage.googleapis.com/v1beta/${f.name}`, { headers: { 'x-goog-api-key': S.geminiKey } });
    f = await g.json();
  }
  if (f.state && f.state !== 'ACTIVE') throw new Error('Gemini kon het bestand niet verwerken (' + f.state + ')');
  return f.uri;
}
function geminiMime(m) {
  m = (m || '').split(';')[0];
  if (/mp4|m4a|aac|quicktime|x-m4a/.test(m)) return 'audio/mp4';
  if (/mpeg|mp3/.test(m)) return 'audio/mp3';
  if (/wav/.test(m)) return 'audio/wav';
  if (/ogg|opus/.test(m)) return 'audio/ogg';
  if (/webm/.test(m)) return 'audio/webm';
  if (/flac/.test(m)) return 'audio/flac';
  return m || 'audio/mp4';
}

async function sttGemini(blob, seg, ctxText) {
  const mime = geminiMime(blob.type || seg.mime);
  const gl = glossaryList();
  const prompt = `Je bent een professionele notulist/transcribent. Transcribeer dit audiofragment volledig en letterlijk in de gesproken taal (meestal Nederlands${S.lang && S.lang !== 'nl' && S.lang !== 'auto' ? ', verwacht: ' + S.lang : ''}).
Regels:
- Splits per spreekbeurt. Geef elke stem een vast label: "Spreker 1", "Spreker 2", enz. Gebruik een echte naam alleen als die stem zichzelf duidelijk voorstelt of zo wordt aangesproken.
- "start" = begintijd van de spreekbeurt binnen DIT fragment, formaat MM:SS.
- Schrijf correcte zinnen met leestekens. Laat haperingen ("eh", "uhm") weg, maar verander niets aan de inhoud. Niet samenvatten, niets weglaten.
- Onverstaanbaar: schrijf [onverstaanbaar]. Geen spraak: lege lijst.
${gl.length ? '- Spel deze vaktermen/namen correct indien ze voorkomen: ' + gl.join(', ') + '.' : ''}
${ctxText ? '\nContext — dit fragment is een vervolg op een eerder deel van hetzelfde gesprek. ' + ctxText + '\nGebruik voor dezelfde stemmen dezelfde labels.' : ''}`;
  let part;
  if (blob.size > 18 * 1024 * 1024) part = { file_data: { mime_type: mime, file_uri: await geminiUploadFile(blob, mime) } };
  else part = { inline_data: { mime_type: mime, data: await blobToB64(blob) } };
  const schema = { type: 'ARRAY', items: { type: 'OBJECT', properties: { speaker: { type: 'STRING' }, start: { type: 'STRING' }, text: { type: 'STRING' } }, required: ['speaker', 'start', 'text'] } };
  const out = await geminiGenerate({ contents: [{ role: 'user', parts: [part, { text: prompt }] }], json: true, schema, temperature: 0, maxTokens: 60000 });
  let arr; try { arr = JSON.parse(out); } catch { const m = out.match(/\[[\s\S]*\]/); arr = m ? JSON.parse(m[0]) : []; }
  if (!Array.isArray(arr)) arr = arr.segments || [];
  const lines = arr.filter((x) => x && x.text && x.text.trim()).map((x) => ({ speaker: String(x.speaker || 'Spreker 1').trim(), start: Math.min(parseTs(x.start), seg.dur || 1e9), text: x.text.trim() }));
  lines.sort((a, b) => a.start - b.start);
  lines.forEach((l, i) => { l.end = i + 1 < lines.length ? lines[i + 1].start : (seg.dur || l.start + 5); });
  return lines;
}

async function sttEleven(blob, seg) {
  if (!S.elevenKey) throw new Error('Geen ElevenLabs API-sleutel ingesteld (Instellingen).');
  const ext = /mp4|m4a|aac/.test(blob.type) ? 'm4a' : /webm/.test(blob.type) ? 'webm' : /wav/.test(blob.type) ? 'wav' : /mpeg|mp3/.test(blob.type) ? 'mp3' : 'm4a';
  const fd = new FormData();
  fd.append('file', blob, 'opname.' + ext);
  fd.append('model_id', S.elevenModel || 'scribe_v2');
  fd.append('diarize', 'true'); fd.append('tag_audio_events', 'false'); fd.append('timestamps_granularity', 'word');
  const lc = { nl: 'nld', en: 'eng', de: 'deu', fr: 'fra', pl: 'pol', tr: 'tur' }[S.lang];
  if (lc) fd.append('language_code', lc);
  glossaryList().forEach((k) => fd.append('keyterms', k));
  let r;
  try { r = await fetch('https://api.elevenlabs.io/v1/speech-to-text', { method: 'POST', headers: { 'xi-api-key': S.elevenKey }, body: fd }); }
  catch (e) { throw netErr(e, 'ElevenLabs'); }
  if (!r.ok) throw new Error('ElevenLabs ' + await errText(r));
  const d = await r.json();
  const words = (d.words || []).filter((w) => w.type !== 'audio_event');
  const lines = []; let cur = null;
  for (const w of words) {
    const spk = `${seg.idx}:${w.speaker_id || 'speaker_0'}`;
    if (w.type === 'spacing') { if (cur) cur.text += w.text; continue; }
    const longGap = cur && w.start - cur.end > 2.5;
    const tooLong = cur && w.start - cur.start > 45 && /[.?!]\s*$/.test(cur.text);
    if (!cur || cur.speaker !== spk || longGap || tooLong) { cur = { speaker: spk, start: w.start, end: w.end, text: w.text }; lines.push(cur); }
    else { cur.text += w.text; cur.end = w.end; }
  }
  if (!lines.length && d.text) lines.push({ speaker: `${seg.idx}:speaker_0`, start: 0, end: seg.dur || 0, text: d.text });
  lines.forEach((l) => { l.text = l.text.replace(/\s+/g, ' ').trim(); });
  return lines.filter((l) => l.text);
}

async function claudeStream({ system, messages, maxTokens = 8000, onText }) {
  if (!S.anthropicKey) throw new Error('Geen Anthropic (Claude) API-sleutel ingesteld (Instellingen).');
  let r;
  try {
    r = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'x-api-key': S.anthropicKey, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
      body: JSON.stringify({ model: S.claudeModel || 'claude-sonnet-5-5', max_tokens: maxTokens, system, messages, stream: true }) });
  } catch (e) { throw netErr(e, 'Claude'); }
  if (!r.ok) throw new Error('Claude ' + await errText(r));
  const reader = r.body.getReader(); const dec = new TextDecoder(); let buf = ''; let text = '';
  for (;;) {
    const { value, done } = await reader.read(); if (done) break;
    buf += dec.decode(value, { stream: true });
    let idx;
    while ((idx = buf.indexOf('\n')) >= 0) {
      const line = buf.slice(0, idx).trim(); buf = buf.slice(idx + 1);
      if (!line.startsWith('data:')) continue;
      let ev; try { ev = JSON.parse(line.slice(5)); } catch { continue; }
      if (ev.type === 'content_block_delta' && ev.delta?.type === 'text_delta') { text += ev.delta.text; onText?.(text); }
      else if (ev.type === 'error') throw new Error('Claude: ' + (ev.error?.message || 'fout'));
    }
  }
  return text;
}
async function llm({ system, messages, maxTokens = 8000, onText }) {
  if (S.llmProvider === 'gemini') {
    const toParts = (c) => (typeof c === 'string' ? [{ text: c }] : c.map((b) => (b.type === 'image' ? { inline_data: { mime_type: b.source.media_type, data: b.source.data } } : { text: b.text })));
    const contents = messages.map((m) => ({ role: m.role === 'assistant' ? 'model' : 'user', parts: toParts(m.content) }));
    const t = await geminiGenerate({ contents, system, maxTokens: Math.max(maxTokens, 16000), temperature: 0.3 });
    onText?.(t); return t;
  }
  return claudeStream({ system, messages, maxTokens, onText });
}

function speakerOrder(rec) {
  const order = []; for (const l of rec.transcript?.segments || []) if (!order.includes(l.speaker)) order.push(l.speaker);
  return order;
}
function spkName(rec, label) {
  if (rec.speakers?.[label]) return rec.speakers[label];
  if (/^Spreker \d+$/.test(label) || !/^\d+:/.test(label)) return label;
  return 'Spreker ' + (speakerOrder(rec).indexOf(label) + 1);
}
function initials(name) {
  const m = name.match(/^Spreker\s*(\d+)/i); if (m) return 'S' + m[1];
  const w = name.split(/\s+/).filter(Boolean); return ((w[0]?.[0] || '?') + (w.length > 1 ? w[w.length - 1][0] : (w[0]?.[1] || ''))).toUpperCase();
}
function spkColor(rec, label) {
  const names = [...new Set(speakerOrder(rec).map((l) => spkName(rec, l)))];
  return SPK_COLORS[Math.max(0, names.indexOf(spkName(rec, label))) % SPK_COLORS.length];
}
function transcriptText(rec, maxChars = 700000) {
  let t = (rec.transcript?.segments || []).map((l) => `[${fmtT(l.start)}] ${spkName(rec, l.speaker)}: ${l.text}`).join('\n');
  if (t.length > maxChars) t = t.slice(0, maxChars) + '\n…[ingekort]';
  return t;
}
function recContext(rec) {
  const segs = rec.transcript?.segments || [];
  const hl = rec.highlights.map((t) => { const near = segs.filter((l) => l.start <= t + 2 && (l.end ?? l.start) >= t - 25).map((l) => `${spkName(rec, l.speaker)}: ${l.text}`).join(' / '); return `- [${fmtT(t)}] ${near || '(geen tekst)'}`; }).join('\n');
  const notes = rec.notes.map((n) => `- [${fmtT(n.t)}] ${n.text}`).join('\n');
  const names = [...new Set(speakerOrder(rec).map((l) => spkName(rec, l)))].join(', ');
  return `Opname: ${rec.title}\nDatum: ${fmtDateLong(rec.createdAt)}\nDuur: ${fmtDur(rec.duration)}\nSoort: ${({ gesprek: 'overleg / gesprek op locatie', telefoon: 'telefoongesprek (luidspreker)', dictaat: 'ingesproken dictaat' })[rec.type] || rec.type}\nSprekers: ${names || 'onbekend'} (de gebruiker zelf is ${S.userName})\n` +
    (hl ? `\n## Highlights (door gebruiker gemarkeerd — geef extra aandacht)\n${hl}\n` : '') +
    (notes ? `\n## Notities van de gebruiker\n${notes}\n` : '') +
    `\n## Transcriptie\n${transcriptText(rec)}`;
}
const SYS = () => `Je bent de AI-notulist van ${S.userName} van De Laat Bouwbegeleiding (bouwbegeleiding, uitvoering en directievoering, rookgasafvoer-renovaties bij VvE's, EPA-energielabels via Erkend-Energielabel.nl; regio Drechtsteden). Schrijf zakelijk, helder en beknopt Nederlands. Baseer je UITSLUITEND op de transcriptie, notities en highlights; verzin geen namen, bedragen of datums. Markeer onzekerheden met "(onduidelijk)". Verwijs bij belangrijke punten naar tijdstempels in het formaat [mm:ss]. Gebruik Markdown.`;

const Proc = {
  busy: {},
  async transcribe(id) {
    if (this.busy[id]) return; this.busy[id] = true;
    try {
      let rec = await updateRec(id, (r) => { r.status = 'transcribing'; r.error = null; r.progress = 0; if (!r.transcript) r.transcript = { segments: [], done: [] }; });
      View.refresh(id);
      const segs = [...rec.segments].sort((a, b) => a.idx - b.idx);
      for (let i = 0; i < segs.length; i++) {
        const seg = segs[i];
        rec = await DB.get('recs', id); if (!rec) return;
        if (rec.transcript.done.includes(seg.idx)) continue;
        await updateRec(id, (r) => { r.progress = i / segs.length; r.progressText = `Fragment ${i + 1} van ${segs.length}`; }); View.refresh(id);
        const blob = await DB.get('blobs', seg.key);
        if (!blob) { await updateRec(id, (r) => r.transcript.done.push(seg.idx)); continue; }
        let ctx = '';
        const prev = rec.transcript.segments.filter((l) => l.start < seg.start).slice(-8);
        if (prev.length) ctx = `Sprekers tot nu toe: ${[...new Set(rec.transcript.segments.map((l) => l.speaker))].join(', ')}. Laatste uitspraken:\n` + prev.map((l) => `${l.speaker}: ${l.text.slice(0, 200)}`).join('\n');
        let lines;
        for (let attempt = 0; ; attempt++) {
          try { lines = S.sttProvider === 'elevenlabs' ? await sttEleven(blob, seg) : await sttGemini(blob, seg, ctx); break; }
          catch (e) { if (attempt >= 1 || /sleutel|API key|401|403|400/i.test(e.message)) throw e; await sleep(2500); }
        }
        lines.forEach((l) => { l.start += seg.start; l.end = (l.end ?? 0) + seg.start; });
        await updateRec(id, (r) => { r.transcript.segments.push(...lines); r.transcript.segments.sort((a, b) => a.start - b.start); r.transcript.done.push(seg.idx); r.transcript.provider = S.sttProvider; });
        View.refresh(id);
      }
      rec = await updateRec(id, (r) => { r.status = 'transcribed'; r.progress = 1; r.progressText = ''; });
      View.refresh(id);

      if (hasLLM()) {
        if (S.autoTitle && !rec.titleSet) await this.autoTitle(id).catch((e) => console.warn(e));
        if (S.autoSummary && !(await DB.get('recs', id)).summaries.length) await this.summarize(id, S.defaultTemplate);
      }
    } catch (e) {
      console.error(e);
      await updateRec(id, (r) => { r.status = 'error'; r.error = e.message || String(e); });
      View.refresh(id); toast('Transcriptie mislukt: ' + (e.message || e), 5000);
    } finally { delete this.busy[id]; }
  },
  async autoTitle(id) {
    const rec = await DB.get('recs', id);
    const t = await llm({ system: 'Je maakt korte, zakelijke titels in het Nederlands.', maxTokens: 60,
      messages: [{ role: 'user', content: `Geef een korte titel (max. 7 woorden) voor deze opname. Noem project/adres/onderwerp als dat genoemd wordt. Antwoord alleen met de titel, zonder aanhalingstekens.\n\n${transcriptText(rec, 8000)}` }] });
    const title = t.split('\n')[0].replace(/^["'#*\s]+|["'*\s]+$/g, '').slice(0, 80);
    if (title) await updateRec(id, (r) => { if (!r.titleSet) r.title = title; r.titleSet = true; });
    View.refresh(id);
  },
  async summarize(id, tplId, extra) {
    const key = id + ':sum'; if (this.busy[key]) return; this.busy[key] = true;
    const tpl = tplById(tplId);
    const sid = uid();

      await updateRec(id, (r) => { r.summaries.push({ id: sid, tpl: tpl.id, name: tpl.name, kind: tpl.kind || '', content: '', createdAt: Date.now(), busy: true }); });
      View.state.sum = sid; View.state.tab = 'sum'; View.refresh(id);
      const rec = await DB.get('recs', id);
      const instr = (tpl.prompt || '').replaceAll('{USER}', S.userName) + (extra ? `\n\nExtra instructie: ${extra}` : '');
      let last = 0;
      const text = `${recContext(rec)}\n\n---\nOPDRACHT — ${tpl.name}:\n${instr}`;
      const imgs = [];
      for (const k of (rec.photos || []).slice(0, 6)) { const b = await DB.get('blobs', k); if (b) imgs.push({ type: 'image', source: { type: 'base64', media_type: b.type || 'image/jpeg', data: await blobToB64(b) } }); }
      const userContent = imgs.length ? [...imgs, { type: 'text', text: `(Bijgevoegd: ${imgs.length} foto('s) die de gebruiker bij deze opname heeft gemaakt — gebruik ze als context.)\n\n` + text }] : text;

        messages: [{ role: 'user', content: userContent }],
        onText: (t) => { const now = Date.now(); if (now - last > 250) { last = now; View.liveSummary(id, sid, t); } } });

function bindDetail(rec) {

  $$('[data-q]').forEach((b) => b.onclick = () => askRec(id, b.dataset.q));

  if ($('#photos')) loadPhotos(rec);
  $$('[data-act]').forEach((b) => b.onclick = async () => {
    const act = b.dataset.act; const r = await DB.get('recs', id); const s = r.summaries.find((x) => x.id === st.sum);

    switch (act) {
      case 'transcribe': Proc.transcribe(id); renderDetail(id, true); break;
      case 'newsum': templatePicker(id); break;
      case 'regen': if (s) templatePicker(id, s.tpl); break;
      case 'delsum': if (s && await confirmBox('Samenvatting verwijderen?')) { await updateRec(id, (x) => { x.summaries = x.summaries.filter((y) => y.id !== s.id); }); st.sum = null; renderDetail(id, true); } break;
      case 'copy': if (s) copyText(s.content); break;
      case 'share': if (s) shareText(s.content, r.title); break;
      case 'docx': if (s) { b.disabled = true; try { const doc = await buildDocx(r.title, metaLine, s.kind === 'mindmap' ? '# ' + r.title + ' – mindmap\n' + s.content : s.content); await shareOrDownload(doc, safeName(`${r.title} - ${s.name}`) + '.docx'); } catch (e) { toast('Word-export mislukt: ' + e.message); } b.disabled = false; } break;
      case 'pdf': if (s) printDoc(`${r.title} - ${s.name}`, metaLine, s.kind === 'mindmap' ? mindmapHtml(s.content) : `<div class="md">${md(s.content)}</div>`); break;
      case 'speakers': speakerSheet(id); break;
      case 'edit': st.edit = !st.edit; renderDetail(id, true); break;
      case 'trtxt': shareOrDownload(new Blob([`${r.title}\n${metaLine}\n\n${transcriptText(r, 1e9)}`], { type: 'text/plain' }), safeName(r.title) + ' - transcriptie.txt'); break;
      case 'trdocx': { const mdx = `# Transcriptie – ${r.title}\n\n` + (r.transcript.segments.map((l) => `**${spkName(r, l.speaker)}** *${fmtT(l.start)}*  \n${l.text}`).join('\n\n')); const doc = await buildDocx(r.title, metaLine, mdx.replace(/ {2}\n/g, ' — ')); shareOrDownload(doc, safeName(r.title) + ' - transcriptie.docx'); break; }
      case 'clearchat': await updateRec(id, (x) => { x.chat = []; }); renderDetail(id, true); break;
      case 'addnote': { const v = $('#newnote').value.trim(); if (v) { await updateRec(id, (x) => x.notes.push({ t: Player.time(), text: v })); renderDetail(id, true); } break; }
      case 'addphoto': { const inp = $('#filePhoto'); inp.onchange = async () => { for (const f of inp.files) { const k = `${id}:photo:${uid()}`; await DB.put('blobs', await shrinkImage(f), k); await updateRec(id, (x) => x.photos.push(k)); } inp.value = ''; renderDetail(id, true); }; inp.click(); break; }
      case 'audioexp': { const files = []; for (const sg of r.segments) { const bl = await DB.get('blobs', sg.key); if (bl) files.push(new File([bl], `${safeName(r.title)}${r.segments.length > 1 ? ' deel ' + (sg.idx + 1) : ''}.${/mp4|m4a|aac/.test(sg.mime) ? 'm4a' : /webm/.test(sg.mime) ? 'webm' : 'audio'}`, { type: sg.mime })); }
        try { if (navigator.canShare?.({ files })) await navigator.share({ files }); else files.forEach((f) => shareOrDownload(f, f.name)); } catch {} break; }
    }
  });
}
async function shrinkImage(file) {
  try {
    const bmp = await createImageBitmap(file); const max = 1600; const sc = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * sc); c.height = Math.round(bmp.height * sc);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise((res) => c.toBlob((b) => res(b || file), 'image/jpeg', 0.82));
  } catch { return file; }
}
async function loadPhotos(rec) {
  const el = $('#photos'); if (!el) return;
  const urls = [];
  for (const k of rec.photos || []) { const b = await DB.get('blobs', k); if (b) urls.push([k, URL.createObjectURL(b)]); }
  el.innerHTML = urls.map(([k, u]) => `<img src="${u}" data-k="${k}" alt="">`).join('');
  $$('img', el).forEach((img) => img.onclick = async () => {
    const k = img.dataset.k;
    const ov = sheet(`<img src="${img.src}" style="width:100%;border-radius:12px"><div class="btns" style="margin-top:10px"><button class="btn danger sm" id="delph">Verwijder foto</button></div>`);
    $('#delph', ov).onclick = async () => { await DB.del('blobs', k); await updateRec(rec.id, (r) => { r.photos = r.photos.filter((x) => x !== k); }); ov.remove(); renderDetail(rec.id, true); };
  });
}

/* ---- player (meerdere fragmenten als één tijdlijn) ---- */
const Player = {
  rec: null, audio: null, segI: 0, url: null, rate: 1,
  load(rec) {
    this.stop(); this.rec = rec; this.segI = 0;
    this.audio = new Audio(); this.audio.preload = 'metadata';
    this.audio.ontimeupdate = () => this.tick();
    this.audio.onended = () => { if (this.segI + 1 < this.segs().length) { this.loadSeg(this.segI + 1, 0, true); } else this.tick(); };
    this.audio.onplay = this.audio.onpause = () => this.tick();
  },
  segs() { return [...(this.rec?.segments || [])].sort((a, b) => a.idx - b.idx); },
  total() { return this.rec?.duration || this.segs().reduce((m, s) => Math.max(m, s.start + s.dur), 0); },
  async loadSeg(i, offset = 0, play = false) {
    const seg = this.segs()[i]; if (!seg) return;
    this.segI = i; const blob = await DB.get('blobs', seg.key); if (!blob) return;
    if (this.url) URL.revokeObjectURL(this.url);
    this.url = URL.createObjectURL(blob); this.audio.src = this.url; this.audio.playbackRate = this.rate;
    await new Promise((r) => { const done = () => r(); this.audio.addEventListener('loadedmetadata', done, { once: true }); setTimeout(done, 1500); });
    try { this.audio.currentTime = offset; } catch {}
    if (play) this.audio.play().catch(() => {});
  },
  time() { const s = this.segs()[this.segI]; return (s ? s.start : 0) + (this.audio?.currentTime || 0); },
  async seek(t, play) {
    const segs = this.segs(); if (!segs.length) return;
    let i = segs.findIndex((s) => t >= s.start && t < s.start + s.dur); if (i < 0) i = t < segs[0].start ? 0 : segs.length - 1;
    const off = Math.max(0, t - segs[i].start);
    if (i !== this.segI || !this.audio.src) await this.loadSeg(i, off, play);
    else { try { this.audio.currentTime = off; } catch {} if (play) this.audio.play().catch(() => {}); }
    this.tick();
  },
  toggle() { if (!this.audio.src) return this.loadSeg(0, 0, true); if (this.audio.paused) this.audio.play().catch(() => {}); else this.audio.pause(); },
  stop() { try { this.audio?.pause(); } catch {} if (this.url) URL.revokeObjectURL(this.url); this.url = null; },
  html() {
    return `<div class="row"><button class="skip" id="p-back">−15</button><button class="pbtn" id="p-play">▶</button><button class="skip" id="p-fwd">+15</button>
      <div class="grow"><input type="range" id="p-seek" min="0" max="${Math.max(1, Math.round(this.total()))}" step="1" value="0"><div class="ptime"><span id="p-cur">00:00</span><span>${fmtT(this.total())}</span></div></div>
      <button class="speed" id="p-rate">${this.rate}×</button></div>`;
  },
  bind() {
    $('#p-play').onclick = () => this.toggle();
    $('#p-back').onclick = () => this.seek(Math.max(0, this.time() - 15), !this.audio.paused);
    $('#p-fwd').onclick = () => this.seek(Math.min(this.total(), this.time() + 15), !this.audio.paused);
    $('#p-seek').oninput = (e) => { this.dragging = true; $('#p-cur').textContent = fmtT(+e.target.value); };
    $('#p-seek').onchange = (e) => { this.dragging = false; this.seek(+e.target.value, !this.audio.paused); };
    $('#p-rate').onclick = () => { const r = [1, 1.25, 1.5, 2]; this.rate = r[(r.indexOf(this.rate) + 1) % r.length]; this.audio.playbackRate = this.rate; $('#p-rate').textContent = this.rate + '×'; };
    this.tick();
  },
  tick() {
    const t = this.time(); const p = $('#p-play'); if (!p) return;
    p.textContent = this.audio && !this.audio.paused ? '❚❚' : '▶';
    if (!this.dragging) { $('#p-seek').value = Math.round(t); $('#p-cur').textContent = fmtT(t); }
    if (View.state.tab === 'tr' && this.audio && !this.audio.paused) {
      const ls = $$('.line'); let cur = null;
      for (const l of ls) { if (+l.dataset.t <= t + 0.3) cur = l; else break; }
      ls.forEach((l) => l.classList.toggle('cur', l === cur));
      if (cur && cur !== this.lastCur) { this.lastCur = cur; const r = cur.getBoundingClientRect(); if (r.top < 140 || r.bottom > innerHeight - 100) cur.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
    }
  },
};

  document.body.appendChild(ov); return ov;
}

    $('#cy', ov).onclick = () => { ov.remove(); res(true); }; $('#cn', ov).onclick = () => { ov.remove(); res(false); };

async function deleteRec(id) {
  const r = await DB.get('recs', id); if (!r) return;
  for (const s of r.segments) await DB.del('blobs', s.key);
  for (const p of r.photos || []) await DB.del('blobs', p);
  await DB.del('recs', id);
  if (View.cur === id) { Player.stop(); View.cur = null; }
}

/* ---- vraag over alle opnames ---- */
let askAll = [];
async function renderAsk() {
  setTab('ask'); topHome('Vraag over al je opnames');
  const recs = (await DB.all('recs')).filter((r) => r.transcript?.segments?.length).sort((a, b) => b.createdAt - a.createdAt);
  $('#app').innerHTML = `
    <div class="card"><b>Zoek en vraag door al je gesprekken heen</b><div class="hint">Bijv. “Wat is er met de installateur afgesproken over Lage Land?” of “Welke acties staan nog open voor mij deze week?” — ${recs.length} getranscribeerde opname(s) beschikbaar.</div>
    <label class="f">Periode</label><select class="inp" id="aa-period"><option value="7">Afgelopen 7 dagen</option><option value="30" selected>Afgelopen 30 dagen</option><option value="90">Afgelopen 3 maanden</option><option value="0">Alles</option></select></div>
    <div id="aa-chat">${askAll.map((m) => `<div class="msg ${m.role === 'user' ? 'u' : 'a'}"><div class="b ${m.role === 'user' ? '' : 'md'}">${m.role === 'user' ? esc(m.content) : md(m.content)}</div></div>`).join('')}</div>
    <div class="chatin"><textarea id="aa-q" rows="1" placeholder="Stel je vraag…"></textarea><button class="btn lime" id="aa-go" ${hasLLM() && recs.length ? '' : 'disabled'}>➤</button></div>
    ${askAll.length ? '<button class="btn sm ghost" id="aa-clear">Wissen</button>' : ''}`;
  $('#aa-clear') && ($('#aa-clear').onclick = () => { askAll = []; renderAsk(); });
  const go = $('#aa-go');
  $('#aa-q').onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); go.click(); } };
  go.onclick = async () => {
    const q = $('#aa-q').value.trim(); if (!q) return;
    const days = +$('#aa-period').value; const since = days ? Date.now() - days * 864e5 : 0;
    const pool = recs.filter((r) => r.createdAt >= since);
    // eenvoudige relevantie: zoekwoorden-score, dan nieuwste eerst, tot budget
    const words = q.toLowerCase().split(/\W+/).filter((w) => w.length > 3);
    const scored = pool.map((r) => { const txt = (r.title + ' ' + transcriptText(r) + ' ' + r.summaries.map((s) => s.content).join(' ')).toLowerCase(); return { r, s: words.reduce((a, w) => a + (txt.split(w).length - 1), 0) }; })
      .sort((a, b) => b.s - a.s || b.r.createdAt - a.r.createdAt);
    let budget = 500000; const ctx = [];
    for (const { r } of scored) {
      const sum = r.summaries.find((s) => s.content)?.content || '';
      const block = `\n\n=== OPNAME: ${r.title} — ${fmtDateLong(r.createdAt)} ===\n${sum ? 'Samenvatting:\n' + sum + '\n\nTranscriptie:\n' : ''}${transcriptText(r, 120000)}`;
      if (block.length > budget) { if (budget > 5000 && sum) { ctx.push(`\n\n=== OPNAME: ${r.title} — ${fmtDateLong(r.createdAt)} (alleen samenvatting) ===\n${sum}`); budget -= sum.length; } continue; }
      ctx.push(block); budget -= block.length;
    }
    askAll.push({ role: 'user', content: q }); $('#aa-q').value = '';
    await renderAsk();
    const bub = document.createElement('div'); bub.className = 'msg a'; bub.innerHTML = '<div class="b md"><span class="spin"></span></div>'; $('#aa-chat').appendChild(bub); bub.scrollIntoView({ block: 'end' });
    try {
      const ans = await llm({ system: SYS() + `\n\nJe hebt toegang tot meerdere opnames van ${S.userName}. Beantwoord de vraag op basis daarvan. Noem bij elk punt de bron als: (Opnametitel, datum, [mm:ss]). Staat het er niet in, zeg dat.\n${ctx.join('') || '(geen opnames in deze periode)'}`,
        messages: askAll.map((m) => ({ role: m.role, content: m.content })), maxTokens: 4000, onText: (t) => { $('.b', bub).innerHTML = md(t); } });
      askAll.push({ role: 'assistant', content: ans });
    } catch (e) { askAll.push({ role: 'assistant', content: '⚠ ' + e.message }); }
    renderAsk();
  };
}

$('#fileAudio').onchange = async (e) => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  toast('Importeren…');
  const id = uid(); const key = `${id}:0`;
  const dur = await new Promise((res) => { const a = new Audio(); const u = URL.createObjectURL(f); a.preload = 'metadata'; a.onloadedmetadata = () => { res(isFinite(a.duration) ? a.duration : 0); URL.revokeObjectURL(u); }; a.onerror = () => res(0); a.src = u; setTimeout(() => res(0), 5000); });
  const type = f.type || (/\.mp3$/i.test(f.name) ? 'audio/mpeg' : /\.wav$/i.test(f.name) ? 'audio/wav' : 'audio/mp4');
  const blob = new Blob([f], { type });
  try { await DB.put('blobs', blob, key); } catch (err) { return modalMsg('Opslaan mislukt', esc(err.message)); }
  const name = f.name.replace(/\.[^.]+$/, '');
  await DB.put('recs', { id, title: name || 'Geïmporteerde opname', createdAt: f.lastModified || Date.now(), updatedAt: Date.now(), type: /gesprek|call|telefoon/i.test(name) ? 'telefoon' : 'import', duration: dur,

  location.hash = '#/rec/' + id;
  if (S.autoTranscribe && hasSTT()) Proc.transcribe(id);
};

        const r = await fetch('https://api.elevenlabs.io/v1/user/subscription', { headers: { 'xi-api-key': S.elevenKey } }).catch((x) => { throw netErr(x, 'ElevenLabs'); });
        if (!r.ok) throw new Error('ElevenLabs ' + await errText(r)); toast('✔ ElevenLabs verbonden');
      } else { await geminiGenerate({ contents: [{ role: 'user', parts: [{ text: 'Zeg alleen OK' }] }], maxTokens: 50 }); toast('✔ Gemini verbonden (' + S.geminiModel + ')'); }
    } catch (err) { modalMsg('Test mislukt', esc(err.message)); }
    b.textContent = 'Verbinding testen';
  };
  $('#b-exp').onclick = async () => {
    const recs = await DB.all('recs');
    const data = { app: 'dlb-opname', version: APP_VERSION, exportedAt: new Date().toISOString(), templates: customTemplates, recs: recs.map((r) => ({ ...r, segments: r.segments.map((s) => ({ ...s, key: null })), photos: [] })) };
    shareOrDownload(new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' }), `DLB-opname-backup-${new Date().toISOString().slice(0, 10)}.json`);
  };
  $('#b-imp').onclick = () => $('#fileBackup').click();
}
$('#fileBackup').onchange = async (e) => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const d = JSON.parse(await f.text()); if (d.app !== 'dlb-opname') throw new Error('Geen DLB-opname back-up');
    let n = 0; for (const r of d.recs || []) { if (!(await DB.get('recs', r.id))) { r.segments = r.segments.filter((s) => s.key); await DB.put('recs', r); n++; } }
    for (const t of d.templates || []) { await DB.put('templates', t); }
    customTemplates = await DB.all('templates'); toast(`${n} opname(s) teruggezet`); location.hash = '#/';
  } catch (err) { modalMsg('Terugzetten mislukt', esc(err.message)); }
};

/* ---- router ---- */
function route() {
  const h = location.hash || '#/';
  if (h !== '#/rec/' + View.cur && !h.startsWith('#/rec/')) { /* keep player loaded silently */ }
  window.scrollTo(0, 0);
  if (h.startsWith('#/rec/')) return renderDetail(h.slice(6));
  if (h === '#/ask') return renderAsk();
  if (h === '#/import') return renderImport();
  if (h === '#/settings') return renderSettings();
  return renderHome();
}
$$('#tabbar [data-go]').forEach((b) => b.onclick = () => { location.hash = b.dataset.go; });
$('#tb-rec').onclick = () => RecUI.open();
window.addEventListener('hashchange', route);
window.addEventListener('beforeunload', (e) => { if (R.a) { e.preventDefault(); e.returnValue = ''; } });

(async function init() {
  try { await DB.open(); } catch (e) { $('#app').innerHTML = `<div class="card">Opslag niet beschikbaar: ${esc(e.message)}. Gebruik Safari (geen privévenster).</div>`; return; }
  customTemplates = await DB.all('templates');
  await recoverOrphans().catch((e) => console.warn(e));
  // opnames die tijdens transcriberen werden afgebroken: status herstellen
  for (const r of await DB.all('recs')) {
    if (r.status === 'transcribing') await updateRec(r.id, (x) => { x.status = 'error'; x.error = 'Onderbroken — tik op “Opnieuw proberen” om verder te gaan (al verwerkte fragmenten blijven bewaard).'; });
    if (r.status === 'recording') await updateRec(r.id, (x) => { x.status = x.segments.length ? 'recorded' : 'empty'; });
  }
  for (const r of await DB.all('recs')) for (const s of r.summaries) if (s.busy) await updateRec(r.id, (x) => { x.summaries = x.summaries.filter((y) => !y.busy || y.content); x.summaries.forEach((y) => { y.busy = false; }); });
  route();
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
