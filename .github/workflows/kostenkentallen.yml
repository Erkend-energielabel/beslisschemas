name: RVO kostenkentallen bijwerken
on:
  workflow_dispatch:
  push:
    paths: ['tools/kostenkentallen.py', '.github/workflows/kostenkentallen.yml']
  schedule:
    - cron: '23 5 * * 1'   # elke maandag
permissions:
  contents: write
concurrency: { group: kostenkentallen, cancel-in-progress: false }
jobs:
  bijwerken:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install openpyxl
      - name: Excel ophalen en omzetten
        run: python tools/kostenkentallen.py data
      - name: Vastleggen
        run: |
          git config user.name "kostenkentallen-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "RVO kostenkentallen bijgewerkt" && git pull --rebase && git push)
